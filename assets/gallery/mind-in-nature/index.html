 our cognition. The researchers used specially designed video games to measure spatial navigation ability in some 397,000 people from 38 countries around the world. They found that people who grew up outside of cities were best at navigation. They also noted that people who grew up in cities such as Chicago with regular, grid-like street plans could navigate environments similar to their home, but were less adept at navigating more chaotic street plans of older cities such as Prague. The researchers suggest that this demonstrates the importance of urban design in human cognition and brain function.","ti":"Lost in the city"},{"f":"nature_2022-11-24_vol611_no7937.jpg","src":"nature_2022-11-24_vol611_no7937.png","d":"2022-11-24","v":"611","n":"7937","t":"脑与神经科学","ar":0.7539,"s":"The cover illustration shows vacuolar-type adenosine triphosphatases (V-ATPases, large blue structures) on a synaptic vesicle from a nerve cell in the mammalian brain. V-ATPases pump protons across cellular membranes, and in neurons this process is essential for loading neurotransmitters into synaptic vesicles. In this week's issue, Dimitrios Stamou and his colleagues shed light on V-ATPase dynamics in single native synaptic vesicles. By imaging proton-pumping at the single-molecule level, the researchers were able to see that V-ATPases do not pump continuously but instead switch between three distinct modes: proton-pumping, inactive and proton-leaking. The team suggests that this could indicate a broader biological role for ultraslow mode-switching in protein regulation.","ti":"Pump, rest, leak, repeat"},{"f":"nature_2023-04-13_vol616_no7956.jpg","src":"nature_2023-04-13_vol616_no7956.png","d":"2023-04-13","v":"616","n":"7956","t":"认知·心理·行为","ar":0.7539,"s":"Octopuses use chemotactile receptors (CRs) in the suckers on their arms to 'taste by touch' as they explore their sea-floor environment. These proteins evolved from neurotransmitter receptors to allow octopuses to detect poorly soluble natural products on contact. In this week's issue, two papers by Nicholas Bellono, Ryan Hibbs and their colleagues use cephalopod CRs to probe the structural basis of sensory-receptor evolution. In the first , the researchers describe the adaptations in octopus protein structures that underlie the change in receptor function from neurotransmission to detecting environmental stimuli. In the second paper , the team uses this information to explore how tuning sensory receptors drives new behaviour in various cephalopods, including octopus, squid and cuttlefish. Taken together, the studies offer a basis for understanding how subtle structural adaptations can drive novel traits and behaviours that are suited to specific ecological contexts.","ti":"Acquired taste"},{"f":"nature_2023-11-09_vol623_no7986.jpg","src":"nature_2023-11-09_vol623_no7986.png","d":"2023-11-09","v":"623","n":"7986","t":"认知·心理·行为","ar":0.7532,"s":"Hunger, thirst, loneliness and ambition all play a part in determining how much we value food, water, social interaction and our performance outcomes. Pulses of the neurotransmitter dopamine are released into the brain at moments of reward, but it remains unclear how these dopamine signals change when an individual's priorities shift. In this week's publication, Jesse Goldberg and colleagues explore the changes in dopamine signals in male zebra finches (depicted on the cover), as they engage in activities such as drinking, song evaluation and courting. The researchers found that dopamine responses are dynamically adjusted based on the birds' current priorities. For instance, when focused on courting a female, their desire for water decreased, and the dopamine response to both water and song performance diminished. Instead, the male's dopamine signals were driven by social feedback from the female. Importantly, female-driven dopamine release was observed specifically in a part of the male brain dedicated to social communication, revealing a new specificity and prioritization of social reward signals during courtship.","ti":"Social bonds"},{"f":"nature_2023-12-14_vol624_no7991.jpg","src":"nature_2023-12-14_vol624_no7991.png","d":"2023-12-14","v":"624","n":"7991","t":"脑与神经科学","ar":0.7532,"s":"In this week's issue, researchers working as part of the BRAIN Initiative Cell Census Network (BICCN) present nine papers that map the entire mouse brain in unprecedented detail . Three papers by Hongkui Zeng, Xiaowei Zhuang, Evan Macosko and colleagues describe the transcriptomic and spatial cell atlases of the whole mouse brain, depicting the molecular signatures, spatial organization, and cell–cell interactions of thousands of cell types. (A related paper published earlier by Xiao Wang and co-workers also probes the cell type architecture in the brain.) A pair of papers by Edward Callaway, Joseph Ecker, Zhigang He and colleagues examine the links between the identity of neurons and where they extend their axons. And across three papers, Bing Ren, Joseph Ecker and co-workers examine the epigenetic landscape of the mouse brain, looking at regulatory elements in various cell types. Finally, Karthik Shekhar, Joshua Sanes and colleagues use single-cell RNA sequencing data from 17 vertebrate species to probe the evolution of cell types in the retina.","ti":"Brain maps"},{"f":"nature_2024-01-25_vol625_no7996.jpg","src":"nature_2024-01-25_vol625_no7996.png","d":"2024-01-25","v":"625","n":"7996","t":"脑与神经科学","ar":0.7532,"s":"Cerebrospinal fluid (CSF) circulates around the brain and the spinal column, providing mechanical support and nourishment, and helping to clear away impurities. Although it has long been known that CSF drains through the lymphatic system, the precise connections and regulation for the process have proved elusive. In this week's issue, Gou Young Koh and colleagues use fluorescent tracers in mice to reveal a network of lymphatic vessels at the back of the nose, called the nasopharyngeal lymphatic plexus, which facilitates CSF flow from the brain to lymph nodes in the neck — shown on the cover, where green highlights the direct connection of the plexus (upper region) to deep-neck lymphatics (middle and lower regions), blue indicates blood vessels and red is smooth muscles. The researchers note that the plexus is regressed and loses functionality with age, which could inhibit clearance of disease-linked proteins such as amyloid-β, but they show that it is possible to pharmacologically stimulate deep neck lymphatics to counteract the age-related drop in the hub's functionality.","ti":"Brain drain"},{"f":"nature_2024-04-25_vol628_no8009.jpg","src":"nature_2024-04-25_vol628_no8009.png","d":"2024-04-25","v":"628","n":"8009","t":"精神与神经疾病","ar":0.7532,"s":"Timothy syndrome, a rare genetic disorder characterized by heart defects, autism and epilepsy, is caused by a mutant form of the gene CACNA1C , which encodes a calcium-ion channel. In this week's issue, Sergiu Pașca and colleagues present a potential strategy for correcting defects caused by the mutation and treating the syndrome. The researchers developed antisense oligonucleotides aimed at decreasing the gene's use of the protein-coding sequence that carries the mutation in favour of another sequence. They then tested this approach in 3D tissue models — cortical organoids and forebrain assembloids — which they derived from stem cells collected from people with Timothy syndrome. With this proving successful, the team then transplanted the organoids into the cerebral cortex of newborn rats, where they were able to show that treatment with antisense oligonucleotides corrected calcium and nerve cell structural issues caused by the defective gene. The cover features a drone photo of ice patterns that resemble neuron growth.","ti":"Switching channels"},{"f":"nature_2024-07-04_vol631_no8019.jpg","src":"nature_2024-07-04_vol631_no8019.png","d":"2024-07-04","v":"631","n":"8019","t":"认知·心理·行为","ar":0.7532,"s":"Whether it is used to help find prey or to avoid predators, sound is key to survival for many vertebrates. On land, the direction from which a sound originates can readily be determined by gauging the time delay and intensity variation between each ear. Underwater, that is much harder. In this week's issue, Benjamin Judkewitz and colleagues affirm how fish achieve this feat. Working with the small, transparent fish Danionella cerebrum (a stained specimen of which is pictured on the cover), the researchers carefully controlled pressure and particle motion in the water, and imaged sound-induced vibration inside the fish. The team found that, in line with one of several considered hypotheses, the fish compare pressure and particle motion signals to detect the direction of sound sources.","ti":"Hear and there"},{"f":"nature_2024-08-01_vol632_no8023.jpg","src":"nature_2024-08-01_vol632_no8023.png","d":"2024-08-01","v":"632","n":"8023","t":"认知·心理·行为","ar":0.7532,"s":"Psilocybin is the hallucinogenic compound found in magic mushrooms. As well as its psychedelic effects, it also shows promise as part of a treatment regime for conditions such as major depressive disorder and addiction. In this week's issue, Joshua Siegel and colleagues reveal the brain states induced by the drug and how they change over time. Working with seven healthy adults, the researchers used repeated MRI scans to assess the effects over three weeks of taking a single, high dose of psilocybin, and then again in four participants six months later. They found that psilocybin significantly disrupts neural connectivity in the cortex and subcortex by desynchronizing activity within different regions of the brain. The changes were strongest in parts of the brain linked to creating our sense of space, time and self, with some aspects of the disruption lasting for weeks. The team also found that completing a simple audio–visual matching task lessened the effects of the drug on the brain. This suggests that psilocybin can make the brain more malleable, which might be beneficial for treating conditions associated with rigid maladaptive patterns of thought.","ti":"Altered states"},{"f":"nature_2024-10-03_vol634_no8032.jpg","src":"nature_2024-10-03_vol634_no8032.png","d":"2024-10-03","v":"634","n":"8032","t":"脑与神经科学","ar":0.7532,"s":"Neurons in the brain are connected by synapses to form sophisticated circuits that drive complex behaviours such as social interaction and navigation. But to understand how these circuits work requires a map of all the synaptic connections — a 'connectome'. In a series of papers in this week's issue, the FlyWire Consortium unveils and analyses the complete connectome of the brain of an adult female fruit fly ( Drosophila melanogaster ), identifying around 140,000 neurons and more than 50 million synaptic connections. In the first paper, the consortium, led by Mala Murthy and Sebastian Seung , presents the full wiring diagram of the fly's brain along with a network analysis of the connectome. Gregory Jefferis, Davi Bock and colleagues annotate neurons in the connectome, and compare them across individuals, while Seung, Murthy and colleagues annotate the optic lobes, and Murthy and co-workers offer a statistical analysis of the connectome's structure. Sung Soo Kim, Mathias Wernet and co-workers focus on the fly's visual system to provide insight into the circuitry behind navigation. Seung uses connectivity data to uncover a new neural circuit and predict its role in visual function, and Salil Bidaye and colleagues describe a neural circuit for halting behaviour. Philip Shiu and co-workers take the entire connectome and transform it into a computational model to create a sort of 'digital twin' of the fly brain. Finally, Jonathan Pillow and colleagues investigate subcircuits of the connectome and define a path for finding an 'effectome' from the data.","ti":"Wiring diagram"},{"f":"nature_2025-02-27_vol638_no8052.jpg","src":"nature_2025-02-27_vol638_no8052.png","d":"2025-02-27","v":"638","n":"8052","t":"认知·心理·行为","ar":0.7532,"s":"Sea turtles can readily return to feeding sites even after long-distance migration. How they achieve this navigational feat remains unclear, but they are thought to use Earth's magnetic field as a guide. In this week's issue, Kayla Goforth and colleagues reveal that young loggerhead turtles ( Caretta caretta , pictured on the cover) can learn the magnetic signatures of certain areas. The researchers taught young turtles to expect food when exposed to a particular magnetic signature that matched a real geographical location and to expect no food in a second magnetic signature. The turtles reacted differently to the signatures, doing a characteristic 'turtle dance' when they experienced the one associated with food. This suggests the turtles can create an internal magnetic map to help them navigate.","ti":"Turtle recall"},{"f":"nature_2025-04-10_vol640_no8058.jpg","src":"nature_2025-04-10_vol640_no8058.png","d":"2025-04-10","v":"640","n":"8058","t":"脑与神经科学","ar":0.7532,"s":"Understanding how the brain works means understanding the function of neurons and the synaptic architecture in which they sit. That goal edges closer with seven papers in this week's issue from the MICrONS (Machine Intelligence from Cortical Networks) consortium . Together these papers present not only a map of 523 million synapses between 200,000 cells in the visual cortex of a mouse, but also functional imaging of around 75,000 of those neurons captured while the mouse viewed a range of visual stimuli. In the flagship paper , the teams of Sebastian Seung, Clay Reid, Andreas Tolias, Xaq Pitkow, Jacob Reimer, Forrest Collman and Nuno Maçarico da Costa introduce the data set (pictured on the cover). Nuno Maçarico da Costa and colleagues then probe the connectivity of neurons to produce a wiring diagram in a cortical column in the visual cortex. Two papers from Andreas Tolias and co-workers produce general wiring rules based on neuronal function and develop a digital model to test theories and generate an algorithm that can predict the brain's responses to new stimuli. Forrest Collman and colleagues look at how to classify different neuronal types based on structure, and Staci Sorensen and co-workers examine connectivity patterns of neurons matched to their gene-expression data. Finally, a paper from Jacob Reimer and colleagues describes a new tool for analysis and automated proofreading of large electron microscopy reconstructions.","ti":"Cortex in context"},{"f":"nature_2025-05-22_vol641_no8064.jpg","src":"nature_2025-05-22_vol641_no8064.png","d":"2025-05-22","v":"641","n":"8064","t":"精神与神经疾病","ar":0.7532,"s":"Parkinson's disease is characterized by the progressive loss of neurons that produce the neurotransmitter dopamine. Although current treatments can alleviate symptoms in the early stages of the disease, their efficacy ultimately declines. A potential treatment option could be transplanting cells that help replenish the number of dopamine-producing neurons directly into the brain. In this week's issue, independent papers from Jun Takahashi and colleagues, and Viviane Tabar and colleagues present promising results from two clinical trials aimed at affirming the safety of such an approach to treat Parkinson's disease. Takahashi and colleagues used dopaminergic progenitor cells derived from human induced pluripotent stem cells whereas Tabar and colleagues used dopaminergic progenitors derived from human embryonic stem cells. The results of both trials were encouraging: neither reported serious adverse effects from the treatment, suggesting that the approach is safe to use, and both trials also saw some hints of efficacy, although larger scale trials will be needed to assess efficacy properly. The cover shows an artist's impression of the grafted dopamine-producing neurons (gold) in the brain.","ti":"Progress in cell therapy"},{"f":"nature_2025-06-26_vol642_no8069.jpg","src":"nature_2025-06-26_vol642_no8069.png","d":"2025-06-26","v":"642","n":"8069","t":"脑与神经科学","ar":0.7532,"s":"The ability to track neural activity as the brain develops in embryos is key to understanding how neurons self-assemble to form the vertebrate brain. In this week's issue, Jia Liu and colleagues present a bioelectronic solution to this problem in the shape of a soft, stretchable, mesh microelectrode array that can be implanted at the embryonic stage to map the electrical activity of neurons as the embryo grows. Working with frog and axolotl embryos, the researchers implanted their mesh array in the 2D structure called the neural plate, which goes on to become the brain. The array integrates with the plate, stretching and deforming as the brain develops, and providing feedback on how single-neuron activity and population dynamics emerge and evolve. The process is captured on the cover in an artist's impression of the mesh array in place during the four main stages of frog embryo development.","ti":"'Cyborg' tadpoles"},{"f":"nature_2025-11-06_vol647_no8088.jpg","src":"nature_2025-11-06_vol647_no8088.png","d":"2025-11-06","v":"647","n":"8088","t":"脑与神经科学","ar":0.7532,"s":"Our ability to process information into complex emotions, behaviours and decisions relies on the rich diversity of cell types that make up the human brain. Uncovering the molecular and cellular events that take place during brain development could reveal not only the mechanisms that give rise to this diversity but also shed light on how this process might go awry in neurodevelopmental disorders such as autism and schizophrenia. In this week's issue, the BRAIN Initiative Cell Atlas Network (BICAN) builds on its previous work creating atlases of cell types in the adult mouse, non-human primate (NHP) and human brains to present cell-type atlases of the developing human, mouse and NHP brains . Across a suite of papers, nine of which are published in Nature, the researchers uncover the complex programs through which cell types emerge during brain development in humans and animals, revealing both the shared and unique features of the human brain. The latest work, along with future research directions, is summed up in a Perspective article by Tomasz Nowakowski and colleagues .","ti":"Brain development"},{"f":"nature_2026-09-24_vol657_no8133.jpg","src":"nature_2026-09-24_vol657_no8133.png","d":"2026-09-24","v":"657","n":"8133","t":"脑与神经科学","ar":0.7532,"s":"The human brain is made up of billions of functionally diverse cells and this complexity makes it extremely challenging to understand what is happening as the organ ages or becomes subject to disease. In this week's issue, the PsychAD Consortium opens a window on the human brain with a single-cell transcriptomic atlas of the prefrontal cortex. This part of the brain is heavily involved in decision-making, self-control and emotions, and its dysfunction has been linked to psychiatric conditions as well as degenerative diseases such as Alzheimer's. The atlas contains more than 6.3 million nuclei from the brains of 1,494 individuals, including those without any diagnosed disorders as well as those who had conditions such as Alzheimer's, Parkinson's and schizophrenia. In the first of three papers in this issue, the consortium reveals the full atlas and defines gene-expression patterns associated with eight diseases, focusing in particular on Alzheimer's. The second paper uses data from those brains with no signs of disorder to build an atlas of cell-specific RNA expression in the prefrontal cortex from infancy to late adulthood. And the third paper uses single-nucleus transcriptomics to map how genetic risk for brain disorders affects specific cell types. Together with a set of papers published simultaneously in other journals, this work opens fresh paths for exploring brain ageing and disease.","ti":"States of mind"},{"f":"nature_2026-10-08_vol658_no8135.jpg","src":"nature_2026-10-08_vol658_no8135.png","d":"2026-10-08","v":"658","n":"8135","t":"脑与神经科学","ar":0.7532,"s":"Studying how the human brain develops and functions is challenging, not least because access to living human brain tissue is understandably limited. Human brain organoids, models generated from stem cells, have proved valuable in this respect by providing a way to study living neural cells. But these models still have limitations: they are typically not integrated with other brain structures and offer limited insight into circuit-level or behavioural consequences. In this week's issue, Sergiu P. Pașca and colleagues present an experimental model designed to overcome some of these limitations. The researchers developed a genetic strategy to generate mice lacking most of the cerebral cortex and hippocampus, creating space into which they grafted a human cortical organoid, generating what they call a 'xenocortical mouse'. The grafted organoids grew extensively, differentiated into a diverse range of human neural cell types and organized into neural circuits that integrated with the host brain. The researchers were also able to use the model to assess aspects of behaviour and examine the effects of neurological injury. The team suggests that this model could aid the study of human neurodevelopment, neurological and psychiatric disorders, and potentially therapeutic interventions. The work was conducted under extensive ethical oversight, and the team emphasizes the importance of developing appropriate guidance as the field considers the scientific, medical, social and ethical implications of such models.","ti":"Cortical transfer"},{"f":"nature_2026-10-22_vol658_no8137.jpg","src":"nature_2026-10-22_vol658_no8137.png","d":"2026-10-22","v":"658","n":"8137","t":"认知·心理·行为","ar":0.7532,"s":"Hiding from sight or using camouflage are excellent ways to try to avoid being caught while remaining still, but everything has to move at some point and evading predators while in motion is a trickier proposition. It has long been suggested that markings, such as a zebra's stripes, can help to confuse would-be predators, but clear evidence for this is surprisingly lacking. In this week's issue, Jolyon Troscianko and colleagues attempt to address this problem courtesy of butterflies. The team wanted to see if wing markings worked in combination with flight dynamics to help butterflies avoid being eaten by birds when in flight. The researchers approached the issue from multiple angles: first they filmed butterflies during take-off to capture their shape and wingbeat, finding that when combined with wing patterns, their apparent movement shifted backwards and sideways rather than forwards. They then did a phylogenetic analysis, which revealed this kind of effect is widespread among butterfly species. To verify this effect was a result of selection, they created a computer model for the evolution of wing patterns and found that it resulted in wing patterns similar to European butterfly species. Finally, they tested their ideas by having people try to catch virtual butterflies. As a result, the team affirmed that the combination of wing pattern and flight dynamics created an illusion of backwards motion that made it harder to apprehend the insects.","ti":"Winging it"}];
const track=document.getElementById('track');

const html=DATA.map((d,i)=>`<div class="card" data-i="${i}" style="--ar:${d.ar}"><img data-src="img/${d.f}" alt="" decoding="async"></div>`).join('');
const set1=document.createElement('div'); set1.className='set'; set1.innerHTML=html;
const set2=set1.cloneNode(true);
track.append(set1,set2);

/* ---- 封面按需加载 ----
   118 张一次全下会拖慢首屏。这里按播放进度提前取图：pos 走到哪里，
   就把后面大约三屏的封面加载进来，首屏（前十几张）立即加载。
   没用 IntersectionObserver：stage 是 overflow:hidden，观察器判定的"可见"
   会被祖先裁剪影响，和真正看到的并不同步；按位置算更稳。 */
let loadedUpTo = -1;
const avgCardW = () => (setW > 0 ? setW / DATA.length : 400);

function loadCard(i){
  const imgs = track.querySelectorAll('.card[data-i="' + i + '"] img');
  for (const img of imgs) {
    if (!img.dataset.src) continue;
    img.src = img.dataset.src;
    img.removeAttribute('data-src');
  }
}

function ensureLoaded(upto){
  const lim = Math.min(upto, DATA.length - 1);
  if (lim <= loadedUpTo) return;
  for (let i = loadedUpTo + 1; i <= lim; i++) loadCard(i);
  loadedUpTo = lim;
}

let setW=0, pos=0, last=performance.now(), playing=true, speed=80;

function measure(){
  const d=set2.offsetLeft-set1.offsetLeft;
  setW = d>0 ? d : set1.getBoundingClientRect().width;
  if(setW>0) pos%=setW;
}
addEventListener('resize',()=>requestAnimationFrame(measure));
addEventListener('load',measure);
measure();
ensureLoaded(Math.ceil((pos + innerWidth*3) / avgCardW()));

function frame(now){
  const dt=Math.min(now-last,120); last=now;
  if(playing) pos+=speed*dt/1000;
  if(setW>0) pos%=setW;
  track.style.transform=`translate3d(${-pos}px,0,0)`;
  if(setW>0) ensureLoaded(Math.ceil((pos + innerWidth*3) / avgCardW()));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function setPlaying(v){
  playing=v;
  document.body.classList.toggle('paused',!v);
  if(v) closeInfo();
}

/* ---- 说明层（只在暂停时可打开） ---- */
const info=document.getElementById('info');
const kicker=document.getElementById('kicker');
const headline=document.getElementById('headline');
const sub=document.getElementById('sub');
const story=document.getElementById('story');
let infoOpen=false;

function openInfo(i){
  const d=DATA[i]; if(!d) return;
  kicker.textContent=`NATURE · VOL ${d.v} NO ${d.n} · ${d.d}`;
  headline.textContent=d.ti || d.t || '';
  sub.textContent=(d.ti && d.t) ? d.t : '';
  sub.style.display=(d.ti && d.t) ? 'block' : 'none';
  if(d.s){ story.className='body'; story.textContent=d.s; }
  else { story.className='none'; story.textContent='这一期的封面故事原文缺失（Nature 早期期次页面未提供封面说明文字），只能给出期号与主题。'; }
  if(!infoOpen){
    info.classList.add('on');
    requestAnimationFrame(()=>info.classList.add('vis'));
    infoOpen=true;
  }
  info.querySelector('.panel').scrollTop=0;
}
function closeInfo(){
  if(!infoOpen) return;
  info.classList.remove('vis');
  infoOpen=false;
  setTimeout(()=>{ if(!infoOpen) info.classList.remove('on'); },200);
}

track.addEventListener('click',e=>{
  if(playing) return;                      // 播放中点击无反应
  const card=e.target.closest('.card');
  if(card) openInfo(+card.dataset.i);
});
info.addEventListener('click',e=>{ if(e.target.closest('.panel')) return; closeInfo(); });

addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(infoOpen){ closeInfo(); setPlaying(true); }
    else setPlaying(!playing);
  }
  else if(e.code==='Escape'){ e.preventDefault(); if(infoOpen){ closeInfo(); } else { location.href='/projects/'; } }
  else if(e.code==='ArrowRight' && !infoOpen){ e.preventDefault(); speed=Math.min(400,speed+10); }
  else if(e.code==='ArrowLeft' && !infoOpen){ e.preventDefault(); speed=Math.max(10,speed-10); }
},{passive:false});
</script>
</body>
</html>
