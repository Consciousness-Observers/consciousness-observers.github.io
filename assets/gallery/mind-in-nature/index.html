<style>

  .card{position:relative;flex:0 0 auto;height:100%;aspect-ratio:var(--ar);background:#000}
  .card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}

  /* 暂停时点击封面才出现的说明层 */

    position:fixed; inset:0; z-index:50; display:none;
    background:rgba(0,0,0,.76);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    align-items:center; justify-content:center; padding:6vh 6vw;
    opacity:0; transition:opacity .18s ease;
  }
  #info.on{display:flex}

  .panel{
    width:min(700px,100%); max-height:82vh; overflow:auto;
    background:#0d0d11; border:1px solid rgba(255,255,255,.13);
    padding:32px 36px 26px; color:#e8e5de;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    box-shadow:0 30px 90px rgba(0,0,0,.75);
    -webkit-overflow-scrolling:touch;
  }
  .kicker{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#8f897e;
    font-variant-numeric:tabular-nums; margin-bottom:12px}
  .panel h2{margin:0; font-size:21px; line-height:1.4; font-weight:600; color:#fff}
  .sub{margin:8px 0 0; font-size:12.5px; color:#918a7f; letter-spacing:.04em}

    font-size:15.5px; line-height:1.8; color:#d9d5cc; white-space:pre-wrap; word-break:break-word;
  }
  .panel .none{margin:20px 0 0; font-size:13.5px; line-height:1.8; color:#948d82}
  .foot{margin-top:24px; padding-top:14px; border-top:1px solid rgba(255,255,255,.09);
    font-size:11.5px; color:#7d776d; letter-spacing:.03em}

"n":"7005","t":"施万细胞 Cajal 带 · 神经传导","ar":0.7608,"s":"","ti":""},{"f":"nature_2004-10-14_vol431_no7010.jpg","src":"nature_2004-10-14_vol431_no7010.png","d":"2004-10-14","v":"431","n":"7010","t":"亨廷顿病与神经元","ar":0.7608,"s":"","ti":""},{"f":"nature_2005-01-06_vol433_no7021.jpg","src":"nature_2005-01-06_vol433_no7021.png","d":"2005-01-06","v":"433","n":"7021","t":"恐惧表情识别","ar":0.7608,"s":"","ti":""},{"f":"nature_2005-02-03_vol433_no7025.jpg","src":"nature_2005-02-03_vol433_no7025.png","d":"2005-02-03","v":"433","n":"7025","t":"群体决策 · 动物集群","ar":0.7608,"s":"","ti":""},{"f":"nature_2005-03-03_vol434_no7029.jpg","src":"nature_2005-03-03_vol434_no7029.png","d":"2005-03-03","v":"434","n":"7029","t":"视错觉","ar":0.7608,"s":"","ti":""},{"f":"nature_2005-09-08_vol437_no7056.jpg","src":"nature_2005-09-08_vol437_no7056.png","d":"2005-09-08","v":"437","n":"7056","t":"神经递质转运体结构","ar":0.7608,"s":"","ti":""},{"f":"nature_2005-11-10_vol438_no7065.jpg","src":"nature_2005-11-10_vol438_no7065.png","d":"2005-11-10","v":"438","n":"7065","t":"求偶行为与神经元","ar":0.7608,"s":"","ti":""},{"f":"nature_2006-04-13_vol440_no7086.jpg","src":"nature_2006-04-13_vol440_no7086.png","d":"2006-04-13","v":"440","n":"7086","t":"味觉敏感性","ar":0.7608,"s":"","ti":""},{"f":"nature_2006-06-22_vol441_no7096.jpg","src":"nature_2006-06-22_vol441_no7096.png","d":"2006-06-22","v":"441","n":"7096","t":"耳蜗与听觉","ar":0.7608,"s":"","ti":""},{"f":"nature_2006-07-13_vol442_no7099.jpg","src":"nature_2006-07-13_vol442_no7099.png","d":"2006-07-13","v":"442","n":"7099","t":"脑机接口 · 意念控制","ar":0.7608,"s":"","ti":""},{"f":"nature_2006-08-24_vol442_no7105.jpg","src":"nature_2006-08-24_vol442_no7105.png","d":"2006-08-24","v":"442","n":"7105","t":"味觉受体/青少年心智/利他","ar":0.7608,"s":"","ti":""},{"f":"nature_2006-10-19_vol443_no7113.jpg","src":"nature_2006-10-19_vol443_no7113.png","d":"2006-10-19","v":"443","n":"7113","t":"神经退行性疾病专题(Nature Insight)","ar":0.7608,"s":"","ti":""},{"f":"nature_2006-11-09_vol444_no7116.jpg","src":"nature_2006-11-09_vol444_no7116.png","d":"2006-11-09","v":"444","n":"7116","t":"视网膜修复 · 感光前体细胞","ar":0.7608,"s":"","ti":""},{"f":"nature_2007-01-11_vol445_no7124.jpg","src":"nature_2007-01-11_vol445_no7124.png","d":"2007-01-11","v":"445","n":"7124","t":"脑基因表达图谱","ar":0.7608,"s":"","ti":""},{"f":"nature_2007-01-25_vol445_no7126.jpg","src":"nature_2007-01-25_vol445_no7126.png","d":"2007-01-25","v":"445","n":"7126","t":"鱼类逻辑推理与社会序位","ar":0.7608,"s":"","ti":""},{"f":"nature_2007-05-03_vol447_no7140.jpg","src":"nature_2007-05-03_vol447_no7140.png","d":"2007-05-03","v":"447","n":"7140","t":"静息态脑网络","ar":0.7608,"s":"","ti":""},{"f":"nature_2007-08-23_vol448_no7156.jpg","src":"nature_2007-08-23_vol448_no7156.png","d":"2007-08-23","v":"448","n":"7156","t":"神经元迁移与焦虑症","ar":0.7608,"s":"","ti":""},{"f":"nature_2007-10-11_vol449_no7163.jpg","src":"nature_2007-10-11_vol449_no7163.png","d":"2007-10-11","v":"449","n":"7163","t":"语言演化","ar":0.7608,"s":"","ti":""},{"f":"nature_2007-11-01_vol450_no7166.jpg","src":"nature_2007-11-01_vol450_no7166.png","d":"2007-11-01","v":"450","n":"7166","t":"脑与神经科学","ar":0.7608,"s":"This week's issue features neuroscience on the cover in the form of Brainbow, a remarkable new technique that visualizes the track of hundreds of neurons as they wend their way through the brain. There's background on this and other neuroscience papers in this week's podcast, and in the feature Podium interview, Susan Greenfield talks about the problems and potential of consciousness research. Subscribe - for free - through iTunes or via the Nature web site","ti":""},{"f":"nature_2008-11-13_vol456_no7219.jpg","src":"nature_2008-11-13_vol456_no7219.png","d":"2008-11-13","v":"456","n":"7219","t":"脑与神经科学","ar":0.7608,"s":"Illuminating camouflage: light-induced dopamine neurons help tadpoles disappear The balance between neurons expressing various neurotransmitters is thought to be set under genetic control during brain development. It's a crucial step, enabling signalling among populations of neurons. A new study by Davide Dulcis and Nicholas Spitzer shows that natural stimuli can also regulate the class of transmitter expressed in the brain of postembryonic Xenopus tadpoles. Like endogenously dopaminergic neurons, neurons newly expressing dopamine drive a simple camouflage behaviour. The cover shows sibling tadpoles, one adapted to a dark background and the other to a white background. Natural light increases the number of dopaminergic neurons in the hypothalamus where this behaviour is controlled; dark exposure causes a decrease. This plasticity in the developing nervous system may have broad implications, and could be relevant to changes in cognitive states regulated by biogenic amines. Intriguingly, bright light therapy is used to treat patients with seasonal affective disorder, a type of depression linked to dysfunctional dopamine signalling. [Article p. 195; News & Views p. 177] (Cover photo: Norma Velazquez Ulloa, Armando de la Torre and Krista Todd.)","ti":""},{"f":"nature_2009-10-15_vol461_no7266.jpg","src":"nature_2009-10-15_vol461_no7266.png","d":"2009-10-15","v":"461","n":"7266","t":"脑与神经科学","ar":0.7608,"s":"Asymmetric division of radial glial progenitors accounts for nearly all neurogenesis in the developing mammalian neocortex. A study of the mouse neocortex shows that this process is regulated by asymmetric inheritance of centrosomes , the main microtubule organizing centres in animal cells, which are intrinsically asymmetrical, made up of older (red in the graphic) and younger (yellow) centrioles. Daughter cells receiving the older of the two centrioles in the main remain in the ventricular zone of the brain's neocortex to replenish the progenitor pool, while daughter cells receiving the new, duplicated centriole (shown green) tend to migrate into the cortex to differentiate into neurons. Cover graphic: Bokelman & Probst/Xavier Studio.","ti":""},{"f":"nature_2009-12-10_vol462_no7274.jpg","src":"nature_2009-12-10_vol462_no7274.png","d":"2009-12-10","v":"462","n":"7274","t":"脑与神经科学","ar":0.7608,"s":"Most of the excitatory neurotransmissions in the central nervous system, - the events that allow neurons to 'talk' to each other - are mediated by ionotropic glutamate receptors that act by opening a transmembrane ion channel upon binding glutamate, and Eric Gouaux and colleagues this week report the crystal structure of the homotetrameric AMPA-subtype rat GluA2 receptor bound to a competitive antagonist. [Image by Alexander Sobolevsky using PyMOL (DeLano Scientific LLC)]","ti":""},{"f":"nature_2010-04-29_vol464_no7293.jpg","src":"nature_2010-04-29_vol464_no7293.png","d":"2010-04-29","v":"464","n":"7293","t":"精神与神经疾病","ar":0.7608,"s":"A study of three pairs of monozygotic (so-called 'identical') twins, in which one twin had multiple sclerosis and the other did not , reveals no genetic, epigenetic or transcriptome differences to explain why one twin had the disease and the other did not. Digging deeper into the data with expression quantitative trait locus mapping revealed tantalizing differences within twin pairs that merit closer examination. And some possible causes can be ruled out. Cover graphics: Fotolia/ Jorge Oksenberg","ti":""},{"f":"nature_2010-11-11_vol468_no7321.jpg","src":"nature_2010-11-11_vol468_no7321.png","d":"2010-11-11","v":"468","n":"7321","t":"精神与神经疾病","ar":0.7608,"s":"This special issue of Nature includes a series of News Features, Comment pieces and Perspectives on our current knowledge of schizophrenia and the research agenda . Advances in this area might help to control the condition in the next decades. The cover artwork is by Rodger Casier and NARSAD Artworks, a non-profit organization that showcases artists with mental illness. Proceeds from the art go to the research-funding body NARSAD.","ti":""},{"f":"nature_2011-03-10_vol471_no7337.jpg","src":"nature_2011-03-10_vol471_no7337.png","d":"2011-03-10","v":"471","n":"7337","t":"脑与神经科学","ar":0.7608,"s":"Connectivity forms the basis of functional computations performed by neural circuits, but it is notoriously difficult to follow the complex structural wiring between neurons to the function of individual cells. Now, using a combination of functional imaging and three-dimensional serial electron-microscopic reconstruction at an unprecedented scale, two groups present detailed representations of the connectivity of single cells in the mouse visual system . Davi Bock et al . in Clay Reids lab investigate connectivity in the primary visual cortex, and find that inhibitory neurons receive input from excitatory cells with widely varying functions (represented on the cover by spheres and lines of different colours), consistent with predictions from recent physiological studies of the mouse cortex. Kevin Briggman, Moritz Helmstaedter and Winfried Denk show that direction-selective ganglion cells receive more synapses from a starburst amacrine cell dendrite if their preferred directions are opposites, suggesting that the directional sensitivity of retinal ganglion cells arises from the asymmetry in their wiring with amacrine cells.","ti":""},{"f":"nature_2011-06-02_vol474_no7349.jpg","src":"nature_2011-06-02_vol474_no7349.png","d":"2011-06-02","v":"474","n":"7349","t":"感觉与知觉","ar":0.7608,"s":"Female blood-feeding mosquitoes in search of a meal are attracted by carbon dioxide exhaled in the breath of their vertebrate hosts. The CO 2 detection machinery is a tempting target in the search for ways of disrupting disease transmission by insect vectors. Anandasankar Ray and colleagues have now identified volatile odorants that modify the CO 2 detection pathway in the three deadliest mosquito species ( Anopheles gambiae , Aedes aegypti and Culex quinquefasciatus ), and demonstrate the ability of odorants to disrupt CO 2 -mediated attraction behaviour. One compound has the novel property of causing ultra-prolonged activation of CO 2 -detecting nerve cells, with brief exposure resulting in prolonged disorientation. Others mimic or inhibit CO 2 sensing. Compounds used in this proof-of-principle experiment, such as 2,3-butanedione, have properties that preclude use on humans, but this work could lead to the development of a new generation of insect repellents and lures that can work in small quantities. Cover background: A. Bradshaw/Getty.","ti":""},{"f":"nature_2011-06-16_vol474_no7351.jpg","src":"nature_2011-06-16_vol474_no7351.png","d":"2011-06-16","v":"474","n":"7351","t":"感觉与知觉","ar":0.7608,"s":"Hearing is initiated by the movement of tiny bundles of cilia located at the top of hair cells inside the ear. Despite being surrounded by the viscous fluid that bathes the inner ear, these stereocilia remain sensitive to movements of atomic dimension. The mechanism that makes this possible by eliminating most of the viscous drag in the liquid between the stereocilia has now been demonstrated . Analysis of the balance of forces in bullfrog hair cell stereocilia on a subnanometre scale shows that, at the frequencies used in hearing, most stereocilia inside the hair bundle are shielded from the external liquid and move almost as one. The cover depicts simulations of the motion of the hair bundles; increasing sound frequency progressively entrains more stereocilia (middle image) until the bundle moves as a unit over a broad range of audible frequencies (back image).","ti":""},{"f":"nature_2011-06-23_vol474_no7352.jpg","src":"nature_2011-06-23_vol474_no7352.png","d":"2011-06-23","v":"474","n":"7352","t":"认知·心理·行为","ar":0.7608,"s":"By 2050, two-thirds of the world's population will be living in cities. Although city living has many advantages, rapidly increasing urbanization has major health implications — schizophrenia is more common in people born in cities than in those from less heavily populated districts, and living in cities increases the rates of depression and anxiety disorders. It has been suggested that social stress plays a part in these effects, but the mechanisms involved are unknown. Now, in a study of healthy German volunteers using functional magnetic resonance imaging, a key brain structure for negative emotion (the amygdala) was found to be more active during stress in city dwellers, and a regulatory brain area (the cingulate cortex) more active in people born in cities. These results identify potential mechanisms linking social environment and mental illness , and might contribute to planning healthier urban surroundings. Cover image: O. Dusegård/Getty.","ti":""},{"f":"nature_2011-08-04_vol476_no7358.jpg","src":"nature_2011-08-04_vol476_no7358.png","d":"2011-08-04","v":"476","n":"7358","t":"感觉与知觉","ar":0.7608,"s":"A common vampire bat ( Desmodus rotundus ) in flight, photographed in Mexico. These blood-feeding bats have evolved the ability to detect infrared (IR) radiation as a means of locating hot spots on warm-blooded prey. Only three other vertebrate lineages have this 'sixth' sense: three distantly related groups of snakes (pit vipers, pythons and boas). In all cases, the IR sensor is a highly specialized facial structure called the pit organ. In the snakes, a non-heat-sensitive ion channel (vertebrate TRPA1) has become an infrared detector. As reported in this issue, vampire bats use a slightly different molecular mechanism whereby RNA splicing generates a variant of the ubiquitous TRPV1 heat-sensitive channel that is tuned to lower temperatures. Comparison of this channel's gene sequence with the equivalent in other mammals lends support to the hypothesis based on molecular data that these bats are evolutionarily grouped with horses, dogs, cows, moles and dolphins (in the Laurasiatheria superorder), rather than with humans, monkeys and rodents (in the Euarchontoglires) as originally proposed on anatomical criteria. Cover: Barry Mansell/naturepl.com","ti":""},{"f":"nature_2011-11-03_vol479_no7371.jpg","src":"nature_2011-11-03_vol479_no7371.png","d":"2011-11-03","v":"479","n":"7371","t":"精神与神经疾病","ar":0.7608,"s":"This issue of Nature puts a spotlight on autism spectrum disorder and tries to sort fact from fiction in this often contentious field. Topics covered include the mysterious increase in the incidence of diagnosed autism; some of the myths that have accumulated around the condition; and the notion that, for some fields of endeavour (science is often mentioned), autism can be advantageous. Cover credit: Daren Newman.","ti":""},{"f":"nature_2012-01-26_vol481_no7382.jpg","src":"nature_2012-01-26_vol481_no7382.png","d":"2012-01-26","v":"481","n":"7382","t":"认知·心理·行为","ar":0.7608,"s":"Hadza women Chausiki and Sislem (with baby) pick ngwilabee berries. The Hadza of northern Tanzania are almost totally cut off from the modern developed world, providing anthropologists with a useful model of an early hunter-gatherer society. A study of Hadza social networks , quantifying their ties to each other and their propensity to cooperate, shows that the main characteristics of modernized networks, such as transitivity and homophily, are observed in the Hadza. In addition, social ties are more likely between individuals with similar levels of public goods game donations, and Hadza camps exhibit high between-group and low within-group variation in cooperation. Taken together, these results provide the strongest evidence so far that these key features of human networks reflect shared ancestry and may have developed at an early point in human history. Photo: Martin Schoeller/August","ti":""},{"f":"nature_2012-02-16_vol482_no7385.jpg","src":"nature_2012-02-16_vol482_no7385.png","d":"2012-02-16","v":"482","n":"7385","t":"脑与神经科学","ar":0.7608,"s":"The channelrhodopsins are light-gated ion channels, found in algae, that have rapidly become familiar in the neuroscience lab as optogenetics reagents: the activities of neurons expressing channelrhodopsins can be optically controlled within systems as complicated as living mammals. The X-ray crystal structure of a chimaera of two channelrhodopsins has now been determined at 2.3 E resolution. The structure reveals the molecular architecture of this ion channel, including the retinal-binding pocket and cation conduction pathway. This work paves the way for the design of new channelrhodopsin variants with enhanced properties. Cover image: Hiroshi M. Sasaki.","ti":""},{"f":"nature_2012-05-17_vol485_no7398.jpg","src":"nature_2012-05-17_vol485_no7398.png","d":"2012-05-17","v":"485","n":"7398","t":"脑与神经科学","ar":0.7608,"s":"Four papers in this issue of Nature present the long-awaited high-resolution crystal structures of the four known opioid receptors in ligand-bound conformations. These G-protein-coupled receptors are the targets of a broad range of drugs, including painkillers, antidepressants, anti-anxiety agents and anti-addiction medications. Brian Kobilka's group reports the crystal structure of the µ-opioid receptor bound to a morphinan antagonist and the &dgr;-opioid receptor bound to naltrindole. Raymond Stevens group reports on the &kgr;-opioid receptor bound to the selective antagonist JDTic, and the nociceptin/orphanin FQ receptor bound to a peptide mimetic. In an associated News and Views, Marta Filizola and Lakshmi Devi discuss the implications of these landmark papers for research on the mechanisms underlying receptor function and drug development. Cover: Universal Images Group/Getty Images.","ti":""},{"f":"nature_2012-08-30_vol488_no7413.jpg","src":"nature_2012-08-30_vol488_no7413.png","d":"2012-08-30","v":"488","n":"7413","t":"脑与神经科学","ar":0.7608,"s":"Some horses  notably the harness-racing American Standardbred and the all-terrain Icelandic breed  have the ability to perform extra gaits. All horses can walk, trot, canter and gallop, but some can also 'pace  moving the two legs on the same side of the body in unison  and/or perform other novel ambling gaits. A genome-wide association analysis of Icelandic horses has identified linkage between a premature stop codon in the DMRT3 gene and the ability to perform alternative gaits. Functional studies in mice show that Dmrt3 is expressed in a subset of spinal cord neurons that are crucial for the normal development of a coordinated locomotor network that controls limb movements. Dmrt3 may therefore have a key role in configuring the spinal circuits that control stride in vertebrates. In domestic horses, the DMRT3 mutation has had a major impact on the creatures diversification, because the altered gait characteristics of a number of breeds apparently require this mutation. Cover: A competitor in the Landsmót International Horse Competition for pure-bred Icelandic horses, Hella, Iceland, in 2004 (Arctic Images/Corbis).","ti":""},{"f":"nature_2012-09-13_vol489_no7415.jpg","src":"nature_2012-09-13_vol489_no7415.png","d":"2012-09-13","v":"489","n":"7415","t":"认知·心理·行为","ar":0.7608,"s":"Online social networks are everywhere. They must be influencing the way society is developing, but hard evidence is scarce. For instance, the relative effectiveness of online friendships and face-to-face friendships as drivers of social change is not known. In what may be the largest experiment ever conducted with human subjects, James Fowler and colleagues randomly assigned messages to 61 million people Facebook users on Election Day in the United States in 2010, and tracked their behaviour both online and offline, using publicly available records. The results show that the messages influenced the political communication, information-seeking and voting behaviour of millions of people. Social messages had more impact than informational messages and 'weak ties' were much less likely than 'strong ties' to spread behaviour via the social network. Thus online mobilization works primarily through strong-tie networks that may exist offline but have an online representation. Cover: Kelly Krause/ Nature","ti":""},{"f":"nature_2012-09-20_vol489_no7416.jpg","src":"nature_2012-09-20_vol489_no7416.png","d":"2012-09-20","v":"489","n":"7416","t":"脑与神经科学","ar":0.7608,"s":"High-resolution maps of genome-wide gene expression have been available for mice for a few years, but only relatively coarse equivalents have been published for the human brain because of the challenges presented by the 1,000-fold increase in size and the limited availability and quality of postmortem tissue. Now Michael Hawrylycz and colleagues at the Allen Institute for Brain Science in Seattle, Washington, have used laser microdissection and microarrays to assess 900 precise subdivisions in brains from two healthy men with 60,000 gene-expression probes. The resulting atlas, freely available at www.brain-map.org, allows comparisons between humans and other animals, and will facilitate studies of human neurological and psychiatric diseases. One early observation from the data is a human-specific pattern compared with the mouse and rhesus monkey for the calcium-binding protein CALB1 in the hippocampus. Cover image: Allen Institute for Brain Science.","ti":""},{"f":"nature_2012-10-11_vol490_no7419.jpg","src":"nature_2012-10-11_vol490_no7419.png","d":"2012-10-11","v":"490","n":"7419","t":"精神与神经疾病","ar":0.7608,"s":"Some individuals can cope with stress from the extremes of battle to the pressures of modern life with no apparent ill effects. Others in similar situations will develop serious mental illness. The efforts of neuroscientists to track down the elusive links between life experience and mental illness are the focus of in this week's Nature. Cover: Paddy Mills","ti":""},{"f":"nature_2013-01-17_vol493_no7432.jpg","src":"nature_2013-01-17_vol493_no7432.png","d":"2013-01-17","v":"493","n":"7432","t":"神经递质不对称释放","ar":0.7608,"s":"","ti":""},{"f":"nature_2013-05-16_vol497_no7449.jpg","src":"nature_2013-05-16_vol497_no7449.png","d":"2013-05-16","v":"497","n":"7449","t":"透明脑 · 神经连接","ar":0.7608,"s":"","ti":""},{"f":"nature_2013-08-08_vol500_no7461.jpg","src":"nature_2013-08-08_vol500_no7461.png","d":"2013-08-08","v":"500","n":"7461","t":"脑与神经科学","ar":0.7608,"s":"The cover represents a rendering of 7 of 950 neurons reconstructed in a piece of mouse retina and their mutual contacts (cyan spheres, 112 of 579,724 contacts) together with their contact matrix (see page 168). Three papers in this issue use the retina as a model for mapping neuronal circuits from the level of individual synaptic contacts to the long-range scale of dendritic interactions. Helmstaedter et al. used electron microscopy to map a mammalian retinal circuit of close to a thousand neurons. The work reveals a new type of retinal bipolar neuron and suggests functional mechanisms for known visual computations. The other two groups studied the detection of visual motion in the Drosophila visual system a classic neural computation model. Takemura et al. used semi-automated electron microscopy to reconstruct the basic connectome (8,637 chemical synapses among 379 neurons) of Drosophilas optic medulla. Their results reveal a candidate motion detection circuit with a wiring plan consistent with direction selectivity. Maisak et al. used calcium imaging to show that T4 and T5 neurons are divided into specific subpopulations responding to motion in four cardinal directions, and are specific to ON versus OFF edges, respectively.(Cover: Julia Kuhl & Winfried Denk)","ti":""},{"f":"nature_2013-09-05_vol501_no7465.jpg","src":"nature_2013-09-05_vol501_no7465.png","d":"2013-09-05","v":"501","n":"7465","t":"认知·心理·行为","ar":0.7608,"s":"An artists rendition of the NeuroRacer cognitive training video game designed for older adults. Our ability to multitask and our capacity for cognitive control decline linearly as we age. A new study shows that cognitive training can help repair this decline. In older adults aged between 60 and 85 who trained at home by playing NeuroRacer, a custom-designed 3D video game, both multitasking and cognitive control improved, with effects persisting for six months. The benefits of this training extended to untrained cognitive functions such as sustained attention and working memory. These findings suggest that the ageing brain may be more robustly plastic than previously thought, allowing for cognitive enhancement using appropriately designed strategies. Cover illustration: Matt Omernick","ti":""},{"f":"nature_2013-09-12_vol501_no7466.jpg","src":"nature_2013-09-12_vol501_no7466.png","d":"2013-09-12","v":"501","n":"7466","t":"认知·心理·行为","ar":0.7608,"s":"Juvenile harvest mice engaged in social play. The neural mechanisms underlying the encoding of social reward have remained unknown, despite the need for reinforcement of adaptive social interactions in order to keep such behaviours persistent throughout evolution. Here, Robert Malenka and colleagues report that, in the mouse nucleus accumbens core, the peptide hormone oxytocin is required both for social reinforcement and a form of presynaptic long-term depression of excitatory transmission onto medium spiny neurons. This social reinforcement signal could be disrupted if oxytocin receptors were specifically deleted from inputs arriving from the dorsal raphe nucleus, the major source of serotonin in the brain, or by blocking serotonergic receptors in the nucleus accumbens. Such coordinated activity between oxytocin and serotonin systems provides a possible mechanism for encoding social reinforcement and offers targets for studying further the neural mechanisms of social dysfunction. Cover: Jean-Louis Klein & Marie-Luce Hubert.","ti":""},{"f":"nature_2013-11-07_vol503_no7474.jpg","src":"nature_2013-11-07_vol503_no7474.png","d":"2013-11-07","v":"503","n":"7474","t":"脑与神经科学","ar":0.7608,"s":"Mutations in SHANK3, the gene encoding the SHANK3 synaptic scaffolding protein, are associated with autism, intellectual disability and schizophrenia, but the effect of SHANK3 overexpression is much less clear. Huda Zoghbi and colleagues now show that mice overexpressing Shank3 exhibit mania-like behaviour, seizures and alterations in excitatory/inhibitory balance of neuronal activity. Consistent with the findings in mouse, they identify two patients with hyperkinetic disorders carrying a genetic duplication of the SHANK3-containing region on chromosome 22. These findings support the hypothesis that incorrect gene dosage in either direction (both over- and under-expression) may be detrimental. The authors suggest that the mice used in this work provide a model for the pharmacogenetic underpinnings of some forms of bipolar disorder. Cover: Wei-Hisang Huang.","ti":""},{"f":"nature_2014-03-20_vol507_no7492.jpg","src":"nature_2014-03-20_vol507_no7492.png","d":"2014-03-20","v":"507","n":"7492","t":"认知·心理·行为","ar":0.7608,"s":"The motion-detecting cells of the retina, called direction-selective ganglion cells (DSGCs), have been known about and studied for more than half a century but their precise role in visual processing has remained unclear. Using a combination of genetic, anatomical and imaging techniques, Andrew Huberman and colleagues investigate the connections made by DSGCs in the mouse brain and find that they link specifically to neurons in the superficial layers of primary visual cortex. Inputs from several different DSGC types are combined to convey both directional and orientation information to the cortex. In addition, non-direction-tuned information from the retina is sent to deeper layers of cortex. This reveals that the mouse visual system contains several functionally distinct parallel pathways and that directional and orientation selectivity in the cortex may arise from the earliest stages of visual processing involving motion-detecting cells in the retina. Cover: Kelly Krause/Nature Santiago Cornejo/Shutterstock","ti":""},{"f":"nature_2014-04-10_vol508_no7495.jpg","src":"nature_2014-04-10_vol508_no7495.png","d":"2014-04-10","v":"508","n":"7495","t":"脑与神经科学","ar":0.7608,"s":"Axonal projection patterns from 21 distinct cortical areas (differentially colour coded) derived from 21 mapping experiments to sample the entire cortex, and rendered in 3D by the Brain Explorer program. In this issue, Hongkui Zeng and colleagues present the first brain-wide, mesoscale connectome for a mammalian species the laboratory mouse based on cell-type-specific tracing of axonal projections. The wiring diagram of a complete nervous system has long been available for a small roundworm, but neuronal connectivity data for larger animals has been patchy until now. The new 3D Allen Mouse Brain Connectivity Atlas is a whole-brain connectivity matrix that will provide insights into how brain regions communicate. Much of the data generated in this project will be of relevance to investigations of neural networks in humans.","ti":""},{"f":"nature_2014-05-01_vol509_no7498.jpg","src":"nature_2014-05-01_vol509_no7498.png","d":"2014-05-01","v":"509","n":"7498","t":"突触前抑制与运动控制","ar":0.7608,"s":"","ti":""},{"f":"nature_2014-05-15_vol509_no7500.jpg","src":"nature_2014-05-15_vol509_no7500.png","d":"2014-05-15","v":"509","n":"7500","t":"认知·心理·行为","ar":0.7608,"s":"Many migrating birds rely on the Earth's magnetic field for their sense of direction, although what mechanism they use to detect this extraordinarily weak field is unknown. Following the surprise observation that night-migratory songbirds (European robins) tested between autumn 2004 and autumn 2006 in wooden huts on the University of Oldenburg campus seemed unable to orient in the appropriate migratory direction, Henrik Mouritsen and colleagues performed controlled experiments to establish what was happening. They find that robins lose the ability to use the Earth's magnetic field when exposed to low-level AM electromagnetic noise between around 20 kz and 20 MHz, the kind of noise routinely generated by consumer electrical and electronic equipment. Interestingly, the magnetic component of this electromagnetic noise is a thousand times weaker than the lower exposure limits adopted in current World Health Organization (WHO) guidelines, yet it can disrupt the function of an entire sensory system in a higher vertebrate. The birds regain the ability to orient to the Earth's magnetic field when they are shielded from electromagnetic noise in the frequency range from 2 kHz to 5 MHz or when tested in a rural setting. Credit: Kim Taylor–Dorling Kindersley–Getty/ Karl Harrison–Henrik Mouritsen","ti":""},{"f":"nature_2014-08-28_vol512_no7515.jpg","src":"nature_2014-08-28_vol512_no7515.png","d":"2014-08-28","v":"512","n":"7515","t":"脑与神经科学","ar":0.7608,"s":"In a study of the extent to which new patterns of neural activity can be generated through learning, Aaron Batista and colleagues examine neuronal network reorganization in Rhesus macaques learning to control a computer cursor using different patterns of activity in motor cortex. Some new neural activity patterns were more easily generated than others corresponding to more easily learned tasks and these could be predicted mathematically from the network topology at the beginning of the experiment. The authors speculate that the results provide a basis for a neural explanation for the balance between adaptability and persistence in action and thought. Cover: Jasiek Krzysztofiak/Nature","ti":""},{"f":"nature_2014-11-13_vol515_no7526.jpg","src":"nature_2014-11-13_vol515_no7526.png","d":"2014-11-13","v":"515","n":"7526","t":"精神与神经疾病","ar":0.7608,"s":"Clinical depression is the most common major mental health disorder and by some measures, it is responsible for a greater burden of disability than any other cause. In this special issue, Nature asks why the burden is so great, how science is helping, where today's research is headed and what the future may hold.","ti":""},{"f":"nature_2015-01-08_vol517_no7533.jpg","src":"nature_2015-01-08_vol517_no7533.png","d":"2015-01-08","v":"517","n":"7533","t":"脑与神经科学","ar":0.7608,"s":"After injury to the nervous system in the nematode Caenorhabditis elegans, an axon sprouts new growth towards its detached segment; a membrane-tethered fluorophore is shown in blue, and the cytoplasm magenta. Fragments are slightly repositioned for clarity. Massimo Hilliard and colleagues provide a detailed analysis of a highly efficient means of regeneration in the C. elegans nervous system known as axonal fusion, in which separated axon segments are able to spontaneously reconnect and fuse to restore the original circuitry. Fusion in this context prevents the breakdown of the detached axon segment and requires regeneration only to bridge the region of damage. The authors investigate the molecular machinery required for this regenerative process, and find that it begins with changes to the phospholipid composition of the axonal membrane followed by recruitment of specific molecules in the regrowing axon as well as from surrounding tissues. Remarkably, the molecules and mechanisms discovered in this process mirror those involved in the recognition and engulfment of apoptotic cells by phagocytes. Cover design by Nick Valmas, image by Casey Linton.","ti":""},{"f":"nature_2015-01-15_vol517_no7534.jpg","src":"nature_2015-01-15_vol517_no7534.png","d":"2015-01-15","v":"517","n":"7534","t":"认知·心理·行为","ar":0.7608,"s":"A dragonfly, loaded with retroreflective markers, catches a fly. Primates and other vertebrates use internal models to control and predict the consequences of their movements, but invertebrates were thought to rely mostly on reflexes. In a study using motion capture to track the head and body movements of dragonflies catching flying prey, Anthony Leonardo and colleagues demonstrate a complexity of behaviour not previously seen in an insect. Approaching from below, the dragonfly's head locks onto its target while its body manoeuvres to align to the prey's flight path and reduce the distance to the prey. Rather than generating these steering movements reactively, by responding only to changes in prey motion, dragonflies using both reactive and predictive control. These predictions account for the motion of the prey and the dragonfly's own body, and are consistent with generation by internal models. The experimental accessibility of the insect nervous system, combined with the load-carrying capacity of the dragonfly, opens these general principles of motor control to detailed mechanistic dissection. Cover: Igor Siwanowicz & Huai-Ti Lin.","ti":""},{"f":"nature_2015-04-30_vol520_no7549.jpg","src":"nature_2015-04-30_vol520_no7549.png","d":"2015-04-30","v":"520","n":"7549","t":"脑与神经科学","ar":0.7608,"s":"The amygdala is part of the brain important for emotional processing, handling stimuli that have either positive or negative associations the good and the bad. Little is known about how amygdala neurons differentiate or compartmentalize these distinctions. Here, Kay Tye and colleagues identify the basolateral amygdala (BLA) as a site of divergence for circuits mediating positive and negative emotional or motivational responses. In studies in mice they find that neurons in the BLA projecting to fear or reward circuits undergo opposing changes in synaptic strength following fear or reward conditioning. Selective activation of neural populations causes, respectively, either negative or positive reinforcement. Transcriptome analysis reveals candidate genes that may mediate these functional differences. Cover art: Insil Choi.","ti":""},{"f":"nature_2015-08-13_vol524_no7564.jpg","src":"nature_2015-08-13_vol524_no7564.png","d":"2015-08-13","v":"524","n":"7564","t":"感觉与知觉","ar":0.7608,"s":"The California two-spot octopus (Octopus bimaculoides) displays several cephalopod morphological innovations, including powerful sucker-lined prehensile arms and sophisticated camera-like eyes. Octopuses have been called 'the most intelligent invertebrate , with a host of complex behaviours, and a nervous system comparable in size to that of mammals but organized in a very different manner. It had been hypothesized that, as in vertebrates, whole-genome duplication contributed to the evolution of this complex nervous system. Caroline Albertin et al. have sequenced the genome and multiple transcriptomes of O. bimaculoides and find no evidence for such duplications but there are large-scale genome rearrangements closely associated with octopus-specific transposable elements. The core developmental and neuronal gene repertoire turns out to be broadly similar to that of other invertebrates, apart from expansions in two gene families formerly thought to be uniquely expanded in vertebrates the protocadherins (cell-adhesion molecules that regulate neural development) and the C2H2 superfamily of zinc-finger transcription factors. Cover: Judit R. Pungor.","ti":""},{"f":"nature_2015-10-15_vol526_no7573.jpg","src":"nature_2015-10-15_vol526_no7573.png","d":"2015-10-15","v":"526","n":"7573","t":"脑与神经科学","ar":0.7608,"s":"The cover features axial projections of statistical maps obtained from 529 datasets shared through the Neurovault.org repository, arranged according to their projection into a two-dimensional space using independent components analysis. Studies into human brain function attract a great deal of attention in the media, but it is important to be aware of the limitations inherent in the methodologies used and in the way they are being applied. In this Review, Russell Poldrack and Martha Farah explore the techniques that are currently being used to probe brain function in humans, focusing in particular on the study of the neural bases of the mind, and discuss the ability of these methods to test hypotheses about causal mechanisms. They also consider several current and potential real-world applications of human neuroscience and the challenges involved. Cover: Russell Poldrack and Kelly Krause (source: neurovault.org)","ti":""},{"f":"nature_2016-04-07_vol532_no7597.jpg","src":"nature_2016-04-07_vol532_no7597.png","d":"2016-04-07","v":"532","n":"7597","t":"认知·心理·行为","ar":0.7608,"s":"Mental-health disorders are the leading causes of disability worldwide, and the efforts of the World Health Organization and other international bodies in recent years have succeeded in raising political awareness of the fact. In a Comment piece on page 25 of this issue of Nature, Pamela Collins and Shekhar Saxena underline the importance of harnessing that global concern into global action. To that end, they offer six practical suggestions encompassing logistics, training, clinical interventions and public health measures for how we can meet the mental-health needs of vulnerable people everywhere. One high-profile growth area is that of smart-phone apps. But as pointed out in a News Feature on page 20, app technology is moving a lot faster than the medical science supporting it. Cover art: Oliver Munday","ti":""},{"f":"nature_2016-04-28_vol532_no7600.jpg","src":"nature_2016-04-28_vol532_no7600.png","d":"2016-04-28","v":"532","n":"7600","t":"认知·心理·行为","ar":0.7608,"s":"It is thought that the meanings of words and language are represented in a semantic system distributed across much of the cerebral cortex. However, little is known about the detailed functional and anatomical organization of this network. Alex Huth, Jack Gallant and colleagues set out to map the functional representations of semantic meaning in the human brain using voxel-based modelling of functional magnetic resonance imaging (fMRI) recordings made while subjects listened to natural narrative speech. They find that each semantic concept is represented in multiple semantic areas, and each semantic area represents multiple semantic concepts. The recovered semantic maps are largely consistent across subjects, however, providing the basis for a semantic atlas that can be used for future studies of language processing. An interactive version of the atlas can be explored at http://gallantlab.org/huth2016. The cover shows the cortical surface of one subject, overlaid with words predicted to cause particularly strong responses at the corresponding cortical location. Word colours indicate semantic categories: for example, green words are mostly visual and tactile concepts, and red words are mostly social concepts. White lines show the outlines of previously known regions of interest. Cover: Alex Huth","ti":""},{"f":"nature_2016-07-28_vol535_no7613.jpg","src":"nature_2016-07-28_vol535_no7613.png","d":"2016-07-28","v":"535","n":"7613","t":"认知·心理·行为","ar":0.7608,"s":"In Western cultures, some combinations of musical notes are perceived as pleasant, or consonant, and others as unpleasant, or dissonant. The cover shows superimposed frequency spectra of two musical intervals, one consonant (the perfect fifth) and one dissonant (the tritone). The composite frequency spectrum of the consonant interval forms a subset of the harmonic series (integer multiples of a common fundamental frequency, indicated by the black line segments). By contrast, the frequency spectrum of the dissonant interval is inharmonic. The aesthetic contrast between consonance and dissonance is commonly thought to be biologically determined and thus to be universally present in humans. Josh McDermott and colleagues put this idea to the test by conducting experiments in remote areas of the Bolivian Amazon rainforest, working with the Tsimane , an indigenous society that has remained relatively isolated from Western culture. They found that the Tsimane rated consonant and dissonant chords and vocal harmonies as equally pleasant. By contrast, Bolivian city- and town-dwellers preferred consonance, albeit to a lesser degree than US residents. These findings suggest that the preference for consonance over dissonance is not universal, and probably develops from exposure to particular types of polyphonic music.","ti":""},{"f":"nature_2016-08-11_vol536_no7615.jpg","src":"nature_2016-08-11_vol536_no7615.png","d":"2016-08-11","v":"536","n":"7615","t":"脑与神经科学","ar":0.7608,"s":"Version 1.0 of the Human Connectome Project's multi-modal human cortical parcellation on a left hemisphere surface model. For more than a century, neuroscientists have sought to subdivide the human cerebral cortex into a patchwork of anatomically and functionally distinct areas. Until now such maps have relied largely on only a single property such as micro-architecture or functional imaging, have been based on a relatively small number of individuals, and have usually been blurry due to misalignment of brain areas from person to person. Matthew Glasser, David Van Essen and colleagues have tackled these deficiencies in a new more 'universal map of the human cerebral cortex by integrating multi-modal imaging data obtained from 210 healthy subjects and validated on 210 other individuals. The authors propose a total of 180 areas per cerebral hemisphere (97 of them previously unknown) and apply a machine-learning classifier to automatically identify these areas in new subjects, even in individuals with atypical parcellations. This freely available resource will enhance the anatomical accuracy and interpretability of future structural and functional studies of the human brain in health and disease. Cover: Matthew F. Glasser & David C. Van Essen.","ti":""},{"f":"nature_2016-09-01_vol537_no7618.jpg","src":"nature_2016-09-01_vol537_no7618.png","d":"2016-09-01","v":"537","n":"7618","t":"精神与神经疾病","ar":0.7608,"s":"Amyloid plaque reduction with aducanumab, seen in example amyloid PET images at baseline and week 54. Aducanumab is a recombinant human monoclonal antibody that selectively targets the amyloid- (A) peptide aggregates thought to play a part in the neurodegenerative process in Alzheimer's disease. Several Alzheimer's disease drugs have faltered during development in recent years, so there is intense interest in any new results. A new study reports interim results from a clinical trial of monthly infusions of aducanumab in subjects with prodromal or mild Alzheimer's disease. Treatment with aducanumab reduced brain A plaques, an action accompanied by a dose-dependent slowing of clinical decline. The trial data support further development of aducanumab as an A-removing therapy.","ti":""},{"f":"nature_2016-09-15_vol537_no7620.jpg","src":"nature_2016-09-15_vol537_no7620.png","d":"2016-09-15","v":"537","n":"7620","t":"认知·心理·行为","ar":0.7608,"s":"A Hawaiian crow using a stick tool to extract food from a wooden log. Birds in the crow family are renowned for their cognitive abilities. The New Caledonian crow Corvus moneduloides is well known for its ability to make and use foraging tools. Christian Rutz et al. show that it is not some lone outlier it is now joined by another species from the Pacific, the Hawaiian crow Corvus hawaiiensis, better known by its indigenous Hawaiian name 'Alalā. These birds naturally develop tool-using skills when young, and proficient tool use is a species-wide capacity. The authors can say this with confidence as the 'Alalā is extinct in the wild, and they were able to test 104 of the 109 surviving members of the species at the time, all in captivity. The research suggests that the technological skills of tropical crows might be fostered by rather unusual ecological circumstances found on remote islands, such as reduced competition for embedded prey and low predation risk. The discovery of a second tool-using crow species opens up exciting opportunities for comparative studies on animal tool use. Cover photo: Ken Bohn/San Diego Zoo Global","ti":""},{"f":"nature_2016-10-06_vol538_no7623.jpg","src":"nature_2016-10-06_vol538_no7623.png","d":"2016-10-06","v":"538","n":"7623","t":"认知·心理·行为","ar":0.7608,"s":"Our understanding of the neural circuits controlling sleep cycles is still incomplete. The availability of new techniques in optogenetics, pharmacogenetics, microendoscopic calcium imaging and virus-mediated circuit tracing—together with mouse genetics—raise the possibility that many of the mysteries of sleep can be tackled. In a Review in this issue of Nature, Franz Weber and Yang Dan explore the current state of sleep circuit research and plot a course directed towards an ambitious goal: a comprehensive circuit diagram of the sleep–wake control network detailing the functional role of each cell type and the interactions between them. Cover: Kelly Krause/Nature Source images: Twin Design/Shutterstock; Franz Weber & Yang Dan","ti":""},{"f":"nature_2016-11-10_vol539_no7628.jpg","src":"nature_2016-11-10_vol539_no7628.png","d":"2016-11-10","v":"539","n":"7628","t":"脑与神经科学","ar":0.7608,"s":"Artistic representation of interconnected neurons at cellular resolution. With neuronal regeneration being extremely limited in the adult mammalian neocortex, one possible strategy to drive repair in the brain following injury is to utilize transplanted embryonic neurons. However, it is not known how well these neurons develop and integrate into established circuits in the adult. A study published in this issue of Nature uses two-photon microscopy and monosynaptic tracing to show that embryonic neurons transplanted into the visual cortex of adult mice can mature and achieve adult-like properties within four to eight weeks, receiving appropriate inputs and establishing sensory stimulus selective responses. Cover art by Ara Hacobian.","ti":""},{"f":"nature_2016-11-17_vol539_no7629.jpg","src":"nature_2016-11-17_vol539_no7629.png","d":"2016-11-17","v":"539","n":"7629","t":"认知·心理·行为","ar":0.7608,"s":"A Seattle cannabis worker cradles the resin-dusted bud of a strain called Blueberry Cheesecake. The legalization of marijuana has become a topic of debate in the United States and recent reports suggest that cannabis has now overtaken heroin as the most reported illicit drug in users seeking specialist addiction care in Europe. However, there are stark differences in the scientific literature as to how Δ9-tetrayhydrocannabinol (THC), the psychoactive compound in marijuana, affects neural networks, such as the dopamine-driven reward system. In this issue of Nature, Michael Bloomfield et al. review the conflicting evidence between clinical and animal research studies. They conclude that THC exposure produces complex and potentially long-term effects on the dopamine system including increased nerve firing and dopamine release in response to acute THC, and dopaminergic blunting associated with long-term use. Future research, they suggest, should focus on the relationships between cannabis-induced alterations in the dopamine system and behavioural effects in humans and animal models. Cover : Lynn Johnson/National Geographic Creative","ti":""},{"f":"nature_2017-05-18_vol545_no7654.jpg","src":"nature_2017-05-18_vol545_no7654.png","d":"2017-05-18","v":"545","n":"7654","t":"认知·心理·行为","ar":0.7608,"s":"A group's collective action towards a common goal, even if everyone's interests are aligned, faces a 'coordination' problem: an individual's attempts to reach a solution that is optimal for him or her locally may not be optimal for the group as a whole. In this issue, Nicholas Christakis and Hirokazu Shirado demonstrate a potential solution to this problem in the shape of autonomous software (artificial intelligence) agents, or 'bots'. They introduced simple bots into small networks of humans engaged in solving a standard colour coordination game — in which the collective goal is for every node to have a colour different from all of its neighbour nodes — thus creating a 'heterogeneous system' of humans and bots. They found that using the bots to introduce noise into the decision-making process could improve the overall performance of the group. The noisy bots worked best when they were placed centrally in the network and they displayed moderate (10%) randomness. Under these conditions, the bots not only improved human–bot interactions but also human–human interactions at distant nodes, thereby helping humans to help themselves. Cover image: Cavan Huang","ti":""},{"f":"nature_2017-07-13_vol547_no7662.jpg","src":"nature_2017-07-13_vol547_no7662.png","d":"2017-07-13","v":"547","n":"7662","t":"精神与神经疾病","ar":0.7608,"s":"The cover image shows a paired helical filament of tau protein, which is the major component of tangles in Alzheimer's disease. Tau filaments make up the protein inclusions seen inside nerve cells in the brains of people with many neurodegenerative conditions, including Alzheimer's. In this issue, Sjors Scheres, Michel Goedert and their colleagues reveal the first high-resolution structures of the two forms of tau filaments in Alzheimer's disease. The filaments were isolated from the brain of an individual with Alzheimer's and imaged using cryo-electron microscopy. In both forms, the individual tau proteins form C shapes (white and blue), which stack together to form filaments. The high-resolution structures of these filaments may help the development of novel diagnostics and therapeutic compounds. Cover image: Thomas G. Martin","ti":""},{"f":"nature_2017-07-27_vol547_no7664.jpg","src":"nature_2017-07-27_vol547_no7664.png","d":"2017-07-27","v":"547","n":"7664","t":"感觉与知觉","ar":0.7608,"s":"The cover shows the larva of a zebrafish (Danio rerio). In this issue, Florian Engert and his colleagues offer insight into the sensory system that allows fish to detect the flow of the water in which they swim. In a behaviour known as rheotaxis, fish consistently manage to orient and swim against oncoming currents, even when they lack any visual cues. The authors investigated this ability in larval zebrafish, and found that the secret is a series of hair cells — shown in red — known as the lateral line. They propose that these hair cells are used to estimate flow direction by detecting the rotation of local flow fields around the fish body. In the wild, this would enable the fish to navigate in environments that lack visual cues. Cover illustration: Julia Kuhl; zebrafish image: Robert Kasper & Pablo Oteiza","ti":""},{"f":"nature_2017-08-24_vol548_no7668.jpg","src":"nature_2017-08-24_vol548_no7668.png","d":"2017-08-24","v":"548","n":"7668","t":"脑与神经科学","ar":0.7608,"s":"Rapid triggering of neurotransmitter release by action potentials requires that synaptic vesicles are primed for fast fusion with the presynaptic membrane, but the molecular basis of vesicle priming has been unclear. An interaction between the SNARE complex and the protein synaptotagmin-1 has already been identified as part of the process. In this week's issue, Axel Brunger and colleagues complete the picture with crystal structures of a primed pre-fusion complex consisting of the SNARE complex (green, red and blue) and the protein complexin (yellow) and a second synaptotagmin-1 molecule (violet). This complex includes a newly revealed tripartite SNARE–complexin–synaptotagmin-1 interface that primes and locks the complex ready for action. Action-potential-driven calcium ions bind to the two synaptotagmin-1 proteins to unlock the complex and trigger membrane fusion on a sub-millisecond timescale. Cover image: Eric Smith, Jeremy Leitz and Qiangjun Zhou","ti":""},{"f":"nature_2017-11-09_vol551_no7679.jpg","src":"nature_2017-11-09_vol551_no7679.png","d":"2017-11-09","v":"551","n":"7679","t":"星形胶质细胞与突触塑形","ar":0.7608,"s":"","ti":""},{"f":"nature_2018-02-22_vol554_no7693.jpg","src":"nature_2018-02-22_vol554_no7693.png","d":"2018-02-22","v":"554","n":"7693","t":"认知·心理·行为","ar":0.7608,"s":"This special issue of Nature examines one of the most misunderstood aspects of human life: adolescence. In two News Features, we explore the neuroscience of risk-taking and rebellion, and look at how the boundaries of adolescence are widening. In a Comment article, developmental psychologist Candice Odgers tackles the relationship between young people and digital technology. And a second Comment piece sees social scientists Jo Boyden and Robert Blum stress the importance of understanding the daily lives of adolescents in low- and middle-income countries. The Feinberg hypothesis, which posits that abnormal pruning of neural connections in adolescence leads to schizophrenia, is reappraised in a News & Views. And a Careers Feature looks at scientists who give teenagers jobs in the lab. Three reviews explore some paradoxes of adolescence. Paediatrician Ronald Dahl and his colleagues review the evidence for adolescence as a physical, cognitive and socio-emotional growth spurt. Epidemiologist George Patton and his colleagues explore how factors that harm adolescent health can affect the next generation. And anthropologists Carol Worthman and Kathy Trang analyse historical changes in the timing of puberty, and shifting cultural definitions of and influences on adolescence. These pieces are part of a collection on adolescence from nine journals in the Nature family and its sister publication, Scientific American. Cover image: Eric Nyquist","ti":""},{"f":"nature_2018-06-07_vol558_no7708.jpg","src":"nature_2018-06-07_vol558_no7708.png","d":"2018-06-07","v":"558","n":"7708","t":"感觉与知觉","ar":0.7539,"s":"Skates and sharks have specialized electrosensory organs that detect weak electric fields and communicate the information to their central nervous systems. In this issue, David Julius and his colleagues analyse sensory cells within these organs and show that although both skates and sharks use similar low-threshold voltage-gated calcium channels to start the cellular process, they each use distinct potassium channels to modulate this activity. The authors found that the potassium channels in the chain catshark ( Scyliorhinus retifer ) support large, repetitive membrane voltage spiking in response to electrical stimuli, but those in the little skate ( Leucoraja erinacea , pictured on the cover) produce smaller, tunable oscillations. The researchers suggest that as a result sharks use their electrosensory capabilities primarily as an aid in predation whereas skates also use them to communicate with one another.","ti":"Body electric"},{"f":"nature_2018-07-05_vol559_no7712.jpg","src":"nature_2018-07-05_vol559_no7712.png","d":"2018-07-05","v":"559","n":"7712","t":"脑与神经科学","ar":0.7539,"s":"Fast inhibitory neurotransmission in the brain is principally mediated by the neurotransmitter γ-aminobutyric acid (GABA) and its synaptic target, the type A GABA receptor (GABA A ). These receptors have a major role in psychological activity in the central nervous system — their dysfunction can lead to disorders such as epilepsy, anxiety and insomnia. They are also the target for drugs, including barbiturates, anaesthetics, alcohol, and the benzodiazepines diazepam (Valium) and alprazolam (Xanax). In this week's issue, Ryan Hibbs and his colleagues report the structure of the predominant isoform of the receptor in the brain. Using cryo-electron microscopy the researchers reveal the human α1β2γ2 GABA A receptor bound to flumazenil, an overdose antidote, and GABA. Each subunit in this heteromeric receptor is a different colour, with the drugs bound shown as teal spheres. The team shows how the receptor is affected by benzodiazepines and reveal sites at specific interfaces between the protein subunits of the receptor that are potential targets for drug development.","ti":"Valium's target"},{"f":"nature_2018-10-18_vol562_no7727.jpg","src":"nature_2018-10-18_vol562_no7727.png","d":"2018-10-18","v":"562","n":"7727","t":"脑与神经科学","ar":0.7539,"s":"The unique ability of cuttlefish, squid and octopuses to hide by imitating the colours and texture of their environment has fascinated natural scientists since the time of Aristotle. Uniquely among all animals, these molluscs control their appearance by the direct action of neurons onto large numbers of expandable pixels called chromatophores located in their skin. In this week's issue, Gilles Laurent and his colleagues used this neuron–chromatophore correspondence to peer into the brain of cuttlefish, inferring the putative structure of control networks through analysing the dynamics of tens of thousands of chromatophores during naturalistic behaviour over timescales ranging from hundredths of seconds to weeks.","ti":"Mind reading"},{"f":"nature_2018-11-01_vol563_no7729.jpg","src":"nature_2018-11-01_vol563_no7729.png","d":"2018-11-01","v":"563","n":"7729","t":"脑与神经科学","ar":0.7539,"s":"Two papers in this week's issue examine the remarkable diversity found among neurons in the brain. Bosiljka Tasic and her colleagues used deep, single-cell RNA-sequencing on 23,822 cells from across the visual and motor cortices in mice to reveal 133 cell types based on gene-expression profiles. They found that nearly all types of inhibitory neurons were shared across the two regions, whereas most types of excitatory neurons were area-specific. In related work, Karel Svoboda, Michael Economo and their colleagues demonstrate that several of these cell types, those corresponding to pyramidal tract neurons (pictured) — a particular subpopulation of excitatory neurons — differ in other ways beyond gene expression. They showed that different pyramidal tract cell types each connect to a unique set of brain regions and communicate specific signals involved in the preparation and initiation of motion, respectively. Together, these studies demonstrate the power of such data sets to reveal the intricate details of neuronal function.","ti":"Action potential"},{"f":"nature_2019-04-18_vol568_no7752.jpg","src":"nature_2019-04-18_vol568_no7752.png","d":"2019-04-18","v":"568","n":"7752","t":"脑与神经科学","ar":0.7539,"s":"The mammalian brain is extremely sensitive to fluctuations in oxygen supply and even short periods of time without blood circulation and oxygen can lead to cell death and irreparable damage. In this week's issue, Nenad Sestan and his colleagues reveal a technological platform consisting of a perfusion device, a cytoprotective and anti-neuronal activity solution, as well as a surgical procedure that can restore microcirculation and cellular functions in an isolated porcine brain multiple hours after death. The system, named Brain Ex , is designed to mimic pulsating blood flow at normal body temperature as it circulates the protective solution through the isolated brain. Four hours after the porcine brains were removed from the body, the researchers introduced them to the Brain Ex system. During a six-hour perfusion period, the team saw a reduction in cell death and the restoration of some cellular functions including synaptic activity, but in the absence of global electrical activity. The team says that it may be possible to use its perfusion system on other organs besides the brain to preserve tissue function after the death of the host.","ti":"Turning back time"},{"f":"nature_2019-07-04_vol571_no7763.jpg","src":"nature_2019-07-04_vol571_no7763.png","d":"2019-07-04","v":"571","n":"7763","t":"脑与神经科学","ar":0.7539,"s":"Knowing how the components of a nervous system are connected together is crucial for understanding how that system works. In this week's issue, Scott Emmons and his colleagues present complete wiring diagrams for both sexes of the model organism Caenorhabditis elegans . These neural maps, or connectomes, which update an influential 1986 publication, were built up from both new and previously published electron micrographs and encompass all connections in the nematode from sensory input to end-organ output. The maps have allowed the researchers to determine the location of each synapse and to assign an indirect measure of the strength of each connection based on the physical size of its constituent synapses. The team was also able to make direct comparisons between the two sexes, and estimate that some 30% of the connections may be substantially different in strength between the male and the hermaphrodite. The two connectomes should help to identify the neural circuits responsible for the nematode worm's behaviour.","ti":"The worm-wide web"},{"f":"nature_2019-07-11_vol571_no7764.jpg","src":"nature_2019-07-11_vol571_no7764.png","d":"2019-07-11","v":"571","n":"7764","t":"认知·心理·行为","ar":0.7539,"s":"What is sleep like for fish? That is the question addressed in this week's issue by Philippe Mourrain, Louis Leung and their colleagues. Although various stages of sleep have been identified and defined in mammals, birds and reptiles, it was not clear if the same held true for other vertebrates such as fish. Using non-invasive molecular, imaging and physiological tools, the Stanford researchers observed neural signatures in zebrafish that can be identified as at least two different sleep states. These states bear similarities to the slow-wave sleep and rapid eye movement sleep states seen in other organisms. The identification of such signatures in fish suggests that these sleep states may have emerged in the vertebrate brain more than 450 million years ago.","ti":"Snooze report"},{"f":"nature_2019-09-05_vol573_no7772.jpg","src":"nature_2019-09-05_vol573_no7772.png","d":"2019-09-05","v":"573","n":"7772","t":"认知·心理·行为","ar":0.7539,"s":"Information gerrymandering can change the way we think about political decisions, as depicted in the cover image. People must integrate disparate sources of information when deciding how to vote. But information does not always flow freely — it can be constrained by social networks and distorted by zealots and automated bots. In this week's issue, Alexander Stewart and his colleagues describe a voting game to probe the relationship between information flow and collective decision-making. In the game, players were assigned to competing parties and placed on a social network that determined whose voting intentions they could observe. The researchers showed that certain network structures can sway the vote outcome towards one party, even when both parties have equal size and each player has the same influence — a phenomenon they call 'information gerrymandering'. A small number of zealots, when strategically placed on the network, can also induce information gerrymandering. Using real-world examples, the team demonstrates that collective decision-making is vulnerable to systematic distortion by information gerrymandering and automated zealot bots.","ti":"Gerrymandered minds"},{"f":"nature_2019-09-26_vol573_no7775.jpg","src":"nature_2019-09-26_vol573_no7775.png","d":"2019-09-26","v":"573","n":"7775","t":"脑与神经科学","ar":0.7539,"s":"Brain tumours are among the most lethal cancers. Primary brain tumours called malignant gliomas and brain metastases from other organs are particularly intractable. Three papers in this week's issue probe the nature of brain tumour growth, shedding light on how the cancerous cells hijack and integrate into the brain's neural network. Michelle Monje and her colleagues, and Frank Winkler and his team each find that cancerous glioma cells form functional synapses with neurons. Douglas Hanahan and his co-workers demonstrate that breast cancer cells metastatic to the brain participate in synaptic structures as a perisynaptic partner. The cancerous cells then use these synapses to promote their growth — the researchers find that activation of the synapses is associated with cancer colonization of the brain, malignant cell proliferation and tumour growth, emphasizing the role played by neuronal activity in brain cancer.","ti":"Brain tumours take root"},{"f":"nature_2019-10-03_vol574_no7776.jpg","src":"nature_2019-10-03_vol574_no7776.png","d":"2019-10-03","v":"574","n":"7776","t":"认知·心理·行为","ar":0.7539,"s":"The cover shows a strawberry poison frog (Oophaga pumilio), a species found in Central America that displays a range of different skin colours. In this week's issue, Yusan Yang and her colleagues reveal how maternal influence shapes both mating preferences and male competition among these frogs — and how this can potentially drive the formation of new species. In imprinting, offspring learn traits from their parents that later in life help to shape their behaviours. The researchers found that among the frogs, female offspring preferred to mate with male frogs that were the same colour as their mother. Similarly, males are more aggressive towards males that are the same colour as their mother. The overall result, the teams suggests, is that this is likely to reduce gene flow between frogs that bear divergent mating traits, thereby setting the stage for speciation to occur by sexual selection.","ti":"Parental guidance"},{"f":"nature_2019-10-17_vol574_no7778.jpg","src":"nature_2019-10-17_vol574_no7778.png","d":"2019-10-17","v":"574","n":"7778","t":"认知·心理·行为","ar":0.7539,"s":"Cigarette smoking dramatically increases the risk of type 2 diabetes, but the mechanisms underlying this effect have remained elusive. In a paper in this issue, Paul Kenny and his colleagues reveal that, in rats, the transcription factor TCF7L2 mediates a signalling circuit that connects neurons in the brain activated by nicotine to blood-glucose regulation by the pancreas. The researchers show that when nicotine activates nicotine acetylcholine receptor (nAChR) proteins expressed on neurons in the medial habenula region of the brain, it also leads to adverse responses to nicotine that limit intake as well as to the release of glucagon and insulin by the pancreas. This in turn raises the levels of blood sugar, which is associated with a higher risk of developing diabetes. In addition, the raised levels of blood sugar create a feedback loop by inhibiting nAChRs expressed by medial habenula neurons, blocking adverse responses to smoking and so helping to establish nicotine dependence. TCF7L2 modulates the entire signalling circuit, thereby linking nicotine addiction with an increased risk of diabetes.","ti":"Smoke signals"},{"f":"nature_2019-11-28_vol575_no7784.jpg","src":"nature_2019-11-28_vol575_no7784.png","d":"2019-11-28","v":"575","n":"7784","t":"脑与神经科学","ar":0.7539,"s":"The cover image shows tau protein (blue) accumulating inside neurons. Alongside amyloid-β, tau is believed to play a significant part in Alzheimer's disease. Whereas amyloid-β accumulates in plaques, hyperphosphorylated tau aggregates in neurofibrillary tangles; these plaques and tangles contribute to neurodegeneration and cognitive decline. Activation in microglia of the NLRP3 inflammasome, a protein complex that is part of the body's natural defences, is essential for amyloid-β plaque formation. In this week's issue, Michael Heneka and his colleagues reveal that the NLRP3 inflammasome also helps to drive the formation of tau tangles. The team shows that tau tangles develop downstream of amyloid-β activating microglia and the NLRP3 inflammasome, lending support to the amyloid-cascade hypothesis in Alzheimer's disease. The researchers also find that tau itself can prompt activation of the inflammasome, hinting that there may be broader implications for other neurodegenerative diseases.","ti":"Twisted tale"},{"f":"nature_2020-01-30_vol577_no7792.jpg","src":"nature_2020-01-30_vol577_no7792.png","d":"2020-01-30","v":"577","n":"7792","t":"脑与神经科学","ar":0.7539,"s":"Reward prediction errors are part of the brain's learning process. They account for the difference between the expected and the actual outcome of an event. The neurotransmitter dopamine is intimately involved in this form of learning — dopamine neurons tend to show increased activity when the outcome of an event is better than expected, but their activity decreases when the outcome is worse than predicted. As a result, learning has been viewed as the brain assessing the likely mean outcome as the basis for predicting the outcome of future events. In this issue, Will Dabney and his colleagues suggest that the picture is more complex. Taking inspiration from distributional reinforcement learning in artificial intelligence, the researchers analysed neuronal recordings from the mouse midbrain and found that instead of the brain representing the future as a single mean, it uses a probability distribution, effectively considering multiple possible future rewards simultaneously.","ti":"Mapping the future"},{"f":"nature_2020-06-25_vol582_no7813.jpg","src":"nature_2020-06-25_vol582_no7813.png","d":"2020-06-25","v":"582","n":"7813","t":"精神与神经疾病","ar":0.7539,"s":"Parkinson's disease is characterized by the loss of neurons that produce the neurotransmitter dopamine. A cure for the condition remains elusive, and current treatments focus on relieving the symptoms. In this week's issue, Xiang-Dong Fu and his co-workers report a way to generate new neurons to replace those lost to the disease. By depleting the levels of an RNA-binding protein called PTB, the researchers have established a single-step method that can efficiently convert astrocytes into functional neurons in live mice. The new neurons reversed the loss of dopamine and restored some motor function in a mouse model of the disease. The technique also works with human cells in vitro, suggesting that it offers a possible route to treatments for neurodegenerative conditions such as Parkinson's.","ti":"Gain of function"},{"f":"nature_2020-12-03_vol588_no7836.jpg","src":"nature_2020-12-03_vol588_no7836.png","d":"2020-12-03","v":"588","n":"7836","t":"认知·心理·行为","ar":0.7539,"s":"Ageing is a degenerative process that leads to tissue dysfunction and death. At a molecular level, disruption to patterns of gene expression caused by the accumulation of epigenetic 'noise' has been suggested as a potential mechanism for the decline in tissue function. In this week's issue, David Sinclair and his colleagues report that expression of three Yamanaka transcription factors in ganglion retina cells reprograms them to a more youthful epigenetic state and turns back the clock for nerve cells in the eye. The researchers found that the transcription factors restored youthful DNA methylation patterns and transcriptomes in the tissue. As a result, mice with damaged optic nerves were able to regrow axons, and vision loss was reversed in a mouse model of glaucoma and in old mice. The team found that enzymes that remove DNA methylation were required to repair eyesight. These results show that mammalian tissues retain a record of youthful information, encoded in part by DNA methylation, which can be accessed to improve tissue function and potentially to reverse the effects of ageing.","ti":"Turning back time"},{"f":"nature_2021-04-08_vol592_no7853.jpg","src":"nature_2021-04-08_vol592_no7853.png","d":"2021-04-08","v":"592","n":"7853","t":"认知·心理·行为","ar":0.7539,"s":"Any attempt to improve an object, idea or situation involves a mental search for possible changes. In this week's issue, Gabrielle Adams, Benjamin Converse and their colleagues reveal that people tend to solve these challenges by adding extra elements even when taking something away would be simpler and more advantageous. The researchers examined how people approached a range of problems, including solving a geometrical puzzle, stabilizing a Lego structure and improving a miniature golf course. They found that people typically default to searching for additive solutions and only consider subtractive solutions when they are able and willing to invest more effort. The team suggests that subtractive solutions are cognitively less accessible to people, and the fact we continually seek to solve problems by adding elements to them may help explain why we struggle to mitigate problems such as overwhelming schedules, excessive red tape and an overburdened planet.","ti":"Less is more"},{"f":"nature_2021-05-13_vol593_no7858.jpg","src":"nature_2021-05-13_vol593_no7858.png","d":"2021-05-13","v":"593","n":"7858","t":"脑与神经科学","ar":0.7539,"s":"Brain–computer interfaces (BCIs) have the potential to restore communication to people who have lost the ability to move or speak. To date, the focus has largely been on motor skills such as reaching or grasping. In this week's issue, Francis Willett and his colleagues present the results from an intracortical BCI that decodes attempted handwriting movements from neural activity in the motor cortex and translates it to text in real time. The researchers worked with a man who is paralysed from the neck down, asking him to try to write by imagining he was holding a pen on a piece of paper. The BCI used a neural network to translate the neural signals into letters, allowing the man to reach a writing speed of 90 characters per minute with an accuracy of 94.1%. The cover features aggregated images of the alphabet derived from the study participant's neural activity as he thought about writing.","ti":"Character building"},{"f":"nature_2021-06-24_vol594_no7864.jpg","src":"nature_2021-06-24_vol594_no7864.png","d":"2021-06-24","v":"594","n":"7864","t":"认知·心理·行为","ar":0.7539,"s":"Many creatures use Earth's magnetic field to help them navigate, but the exact nature of this internal compass has remained elusive. In this week's issue, scientists from the Universities of Oxford and Oldenburg reveal the quantum properties of a protein that makes it a strong contender for the compass in migratory songbirds. The researchers examined the protein cryptochrome ( Er CRY4), which is found in the retina of migratory European robins ( Erithacus rubecula ), and found that it could have the required level of magnetic sensitivity to act as a light-dependent compass. They identified that in vitro Er CRY4 undergoes a light-driven chemical reaction that triggers quantum effects that might enable sensing of magnetic signals. The team also found that the molecule in robins has greater magnetic sensitivity than the equivalent protein in non-migratory pigeons and chickens, leading them to conclude that it is likely to be a key component in the way robins navigate.","ti":"Quantum compass"},{"f":"nature_2021-10-07_vol598_no7879.jpg","src":"nature_2021-10-07_vol598_no7879.png","d":"2021-10-07","v":"598","n":"7879","t":"脑与神经科学","ar":0.7539,"s":"Launched four years ago, the BRAIN Initiative Cell Census Network (BICCN) aims to identify and catalogue the diverse cells types found in mammalian brains. Across 17 papers in this week's issue, the consortium presents the first major instalment of this project : a comprehensive cell census and atlas of the mammalian primary motor cortex, a region of the brain responsible for movement. The atlas integrates information from various sources to define the molecular, anatomical and physiological identities of specific cell types, while also revealing where they reside in the motor cortex tissue. A significant number of cell types are conserved across mice, marmosets and humans, suggesting those cell types play important roles in cortical circuitry and function in mammals.","ti":"Brain census"},{"f":"nature_2021-10-14_vol598_no7880.jpg","src":"nature_2021-10-14_vol598_no7880.png","d":"2021-10-14","v":"598","n":"7880","t":"精神与神经疾病","ar":0.7539,"s":"The protein tau is believed to stabilize the skeleton that shapes nerve cells, but in neurodegenerative diseases known as tauopathies, tau misfolds and stacks together to form filaments. In this week's issue, Sjors Scheres, Michel Goedert and their colleagues build on their previous work identifying different folds of tau filaments present in conditions such as Alzheimer's disease. They reveal four additional folds relating to specific diseases, including progressive supranuclear palsy and argyrophilic grain disease. The researchers then use the various folds to determine a structure-based hierarchical classification of tauopathies. This classification complements clinical diagnosis and post-mortem neuropathology, and can be used to identify new entities. The cover image shows some of the different tau filaments that are so far correlated with specific diseases.","ti":"Protein misfolds"},{"f":"nature_2022-04-07_vol604_no7904.jpg","src":"nature_2022-04-07_vol604_no7904.png","d":"2022-04-07","v":"604","n":"7904","t":"认知·心理·行为","ar":0.7539,"s":"The cover image contrasts the grid-like street plan of Chicago with the more chaotic layout of Prague. In this week's issue, Antoine Coutrot and his colleagues reveal how the environment in which we grow up can affect aspects of
