# CO-LAB Projects
# Category: reading-group, workshops, outreach

- title: "Concepts and Approaches in Psychology"
  slug: concepts-approaches-psychology
  category: reading-group
  contacts:
    - Zihao Wang
  description: >
    A reading group hosted by the Department of Psychology and Behavioral Sciences
    and co-organised with CO-LAB. One concept per session, in three to five original
    papers — five sessions a semester, evenings, over tea. Each session leaves a
    written record, and a summary article.
  status: active

- title: "3D Printing and Digital Brain Anatomy"
  slug: 3d-printing-digital-brain-anatomy
  category: workshops
  contacts:
    - Zihao Wang
  description: >
    A full-day workshop tracing the brain from evolutionary origins to 3D-printed
    model — interactive 3D atlases, real MRI data, and virtual dissection — bridging
    psychology, neuroscience, imaging, and digital fabrication.
  status: active

- title: "Imagine"
  slug: imagine
  category: outreach
  contacts:
    - Zihao Wang
  description: >
    An interdisciplinary art–science exhibition on consciousness, imagination,
    and what happens when imagination is missing — aphantasia and the absent
    inner voice. Science, phenomenology, and art, braided together.
  status: active

