# CO-LAB Members
# All members are equal — no roles, no hierarchy.
# Listed newest first (most recent member at the top).
#
# No per-member `contact:` on purpose: these pages are public and
# indexed, so members' addresses would be harvested. Anyone who wants
# to reach the group uses the address on /join/ instead.

- name: Yixin Xu
  background: Cognitive Neuroscience
  institution: College of Life Sciences, Zhejiang University
  image: 2_q6_Sunny_Photo_近照_4.png
  research_focus: computational neuroscience of consciousness — biologically grounded modeling of consciousness
  statement: "I approach consciousness as a problem that can be progressively constrained through computational models, neural data, and biological mechanisms. Rather than treating consciousness primarily as an abstract philosophical question, I am especially interested in how particular forms of neural organization and dynamics could give rise to different conscious states, contents, and representations of the self. My current interests therefore lie at the intersection of neuroscience, computational modeling, and artificial intelligence."

- name: Shijie Zhang
  background: Physics
  institution: School of Physics, Zhejiang University
  image: shijiezhang.jpg
  research_focus: physics of consciousness — formal ontology of conscious experience
  statement: "I approach consciousness from physics. Rather than asking which brain processes correlate with experience, I am drawn to a more ontological question: what kind of physical object is consciousness itself? I start from the structural features that any conscious experience seems to have — intrinsic, unified, bounded yet without a standard size… — and ask whether these can be given a precise, formal description. My hope is to bring the deep, unifying tools of physics — statistical physics, information theory, the language of modes and geometry — to bear on this question, and to find out where they reach and where they fall short. I don't expect a quick answer; this may be the work of a lifetime, and it may turn out that the right formal language does not yet exist. But I'd rather move toward this question honestly, one step at a time, than around it. I'm here to think alongside others who are drawn to the same mystery from their own directions."

- name: Zihao Wang
  background: Psychology
  institution: Department of Psychology and Behavioral Sciences, Zhejiang University
  image: prof_pic.jpg
  research_focus: "Imaging & Imagery — imagination and brain-state measurement, towards the brain’s construction of “Reality”"
  statement: >-
    At Zhejiang University I lead Imaging & Imagery, a research programme on how
    imagination and perception together build the world we call “Reality”. In the first of
    its two strands I study the cognitive neuroscience of imagination using behavioural
    experiments, high-field task fMRI and EEG/ERP. In the
    second I build the instruments: a computational toolkit over resting-state fMRI that
    combines brain entropy, functional connectivity and EEG, to describe the dynamics of
    brain states and how they differ between healthy people and patients.
  personal_page: https://psychwangzihao.github.io

- name: Yueyang Lu
  background: Optoelectronic Information Science and Engineering
  institution: College of Optical Science and Engineering, Zhejiang University
  image: yueyang_lu.jpg
  research_focus: computational imaging and neural population dynamics — how measurements at one scale speak to another
  statement: >-
    I approach consciousness as something that cannot be settled by finding a single neural
    correlate, or by proposing a theory up front. What interests me is how microscopic neural
    mechanisms connect to population dynamics, behaviour, and experience — and what each
    measurement can actually tell us. Through Zhejiang University's interdisciplinary training
    I have worked on behavioural neuroscience, biosensing, and computational microscopy, and
    the same lesson kept returning: before relating phenomena across scales, we have to
    understand how the states are measured, which information survives, and where the models
    fail. I am now working towards a modest, testable question — whether population spiking
    carries information about subsequent local field potentials beyond stimulus, behaviour and
    signal history. I hope to learn from people approaching consciousness through theory,
    experiment and AI, and to help turn broad questions about experience into precise,
    experimentally constrained ones.

- name: Chenglu Gao
  background: Neuroscience
  institution: Zhejiang University
  image: chenglu_gao.jpg
  research_focus: representations in brains and artificial networks — how representational dynamics might give rise to experience
  statement: >-
    I've always been drawn to philosophy and am particularly curious about the nature of
    consciousness. My previous research has primarily focused on representations in the human
    brain and artificial neural networks. I am especially interested in how neural
    representations evolve over time and how their underlying dynamics may give rise to
    conscious experience.
