- name: Yixin Xu
  background: Cognitive Neuroscience
  institution: College of Life Sciences, Zhejiang University
  image: 2_q6_Sunny_Photo_近照_4.png
  research_focus: computational neuroscience of consciousness — biologically grounded modeling of consciousness
  statement: "I approach consciousness as a problem that can be progressively constrained through computational models, neural data, and biological mechanisms. Rather than treating consciousness primarily as an abstract philosophical question, I am especially interested in how particular forms of neural organization and dynamics could give rise to different conscious states, contents, and representations of the self. My current interests therefore lie at the intersection of neuroscience, computational modeling, and artificial intelligence."

- name: Shijie Zhang
  background: Physics
  institution: School of Physics, Zhejiang University
  image: shijiezhang.jpg
  research_focus: physics of consciousness — formal ontology of conscious experience
  statement: "I approach consciousness from physics. Rather than asking which brain processes correlate with experience, I am drawn to a more ontological question: what kind of physical object is consciousness itself? I start from the structural features that any conscious experience seems to have — intrinsic, unified, bounded yet without a standard size… — and ask whether these can be given a precise, formal description. My hope is to bring the deep, unifying tools of physics — statistical physics, information theory, the language of modes and geometry — to bear on this question, and to find out where they reach and where they fall short. I don't expect a quick answer; this may be the work of a lifetime, and it may turn out that the right formal language does not yet exist. But I'd rather move toward this question honestly, one step at a time, than around it. I'm here to think alongside others who are drawn to the same mystery from their own directions."

- name: Zihao Wang
  background: Psychology
  institution: Department of Psychology and Behavioral Sciences, Zhejiang University
  image: prof_pic.jpg
  research_focus: "Imaging & imagery — consciousness through brain imaging and frontier neuroscience methods: imagination, aphantasia, and what we call reality"
  statement: "I come to consciousness through imaging and imagery. The tools are the ones neuroscience keeps sharpening — fMRI, EEG, TMS — and the question is what they are pointed at: how an image that nobody is looking at can still be seen, and what that tells us about the world we take to be real. I take consciousness, in the narrow sense, to be what we call reality; and I take reality to be built jointly by perception and imagination, neither of them a passive copy of the other. So I work where the two meet: mental imagery in people who have it, aphantasia in people who do not, and the brain states in which either becomes available to awareness. I also build the instruments, because what state a brain is in should be a question with numbers in it. What interests me is not whether an experience is real, but what makes it count as real for the person who has it."
  personal_page: https://psychwangzihao.github.io
