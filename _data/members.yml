- name: Shijie Zhang
  background: Physics
  institution: School of Physics, Zhejiang University
  image: shijiezhang.jpg
  contact: shijiezhang@zju.edu.cn
  research_focus: physics of consciousness — formal ontology of conscious experience
  statement: "I approach consciousness from physics. Rather than asking which brain processes correlate with experience, I am drawn to a more ontological question: what kind of physical object is consciousness itself? I start from the structural features that any conscious experience seems to have — intrinsic, unified, bounded yet without a standard size… — and ask whether these can be given a precise, formal description. My hope is to bring the deep, unifying tools of physics — statistical physics, information theory, the language of modes and geometry — to bear on this question, and to find out where they reach and where they fall short. I don't expect a quick answer; this may be the work of a lifetime, and it may turn out that the right formal language does not yet exist. But I'd rather move toward this question honestly, one step at a time, than around it. I'm here to think alongside others who are drawn to the same mystery from their own directions."

